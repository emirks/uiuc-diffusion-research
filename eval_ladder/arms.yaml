# ladder2 — the arms (the only hand-written config in the campaign).
#
# Every generation row in registry.jsonl names one of these arms; run_gen.py loads the arm's
# adapter and generates that arm's rows. Checkpoints are PINNED here before any score is seen
# (fixed-ckpt selection, pre-registered — no post-hoc best-checkpoint picking).

token: sksz            # transition-slot token; probe-gated (fallback qvtr). Set by train/token_verdict.py.
seeds: [42, 43, 44, 45, 46, 47, 48, 49]   # >=2 seeds per eval item. 44/45 added by exp_078 for the
                          # (46-49 added 2026-08-14 by campaign misc/2026-08-14_timing_relay for the
                          #  advisor-specified 8-seed color-sweep; seed only drives the noise generator,
                          #  arms_cfg["seeds"] is used solely as a soft guard in run_gen.py:203.)
                          # advisor-specified NOISE FLOOR: two independent proxy evals of
                          # ic_gen@5000 ({42,43} vs {44,45}) give the per-cell SD that the
                          # promote bar must be >=2x. Claim-bearing runs still use 42/43.
resolution: [480, 640, 121]
inference: {steps: 30, guidance_scale: 4.0, stg_scale: 1.0, stg_blocks: [29], stg_mode: stg_v}

targets:
  attn: [attn1.to_k, attn1.to_q, attn1.to_v, attn1.to_out.0,
         attn2.to_k, attn2.to_q, attn2.to_v, attn2.to_out.0]
  attn_ffn: [attn1.to_k, attn1.to_q, attn1.to_v, attn1.to_out.0,
             attn2.to_k, attn2.to_q, attn2.to_v, attn2.to_out.0,
             ff.net.0.proj, ff.net.2]

arms:
  base:
    kind: base
    adapter: null
    targets: null
    note: no adapter; same conditioning + prompt as its treatment twin (keyed by input hash)

  text_floor:
    kind: text_floor
    adapter: null
    targets: null
    conditioning: none
    note: prompt only — no prefix/suffix/reference. If it sits near the pool floor, the leak is gone.

  # ---- v2.1.0: the two CLEAN baselines the comparison needs, generated on the treatment
  # endpoints (owner call 2026-07-23). Neither carries a reference, so neither can copy a demo.
  base_prompt:
    kind: base
    adapter: null
    targets: null
    conditioning: none
    # NOTE: never put a bare "#N" inside these unquoted scalars — YAML starts a comment at
    # "space + #", silently truncating (base_prompt) or breaking the parse on the continuation
    # line (base_cond). This killed generation jobs 9646776-78 at yaml.safe_load.
    note: "prompt only, on a treatment endpoint (sidedness-aware). Baseline #1."
  base_cond:
    kind: base
    adapter: null
    targets: null
    note: "prompt + endpoint conditioning (prefix/suffix), NO reference. Baseline #2 — the
      honest no-adapter twin of specialist/generalist (base+reference is a copier, never a
      baseline)."

  # ---- v3: the two CLEAN baselines ON THE CTT GRID (owner call 2026-07-31). Same 152 rows,
  # seeds and geometry as ctt_v2 / ctt_v2_leaky / the refVFX arms, so they are per-card
  # comparable with every column on the IC-LoRA trainings page — which `base_prompt`/`base_cond`
  # above never were (those are the old ladder2 roster and were never generated).
  # Distinct arm NAMES are load-bearing: run_gen.load_rows filters registry.jsonl + the extra
  # registry by arm, so reusing the old names would silently pull the old roster's rows in too.
  # Prompt = the leaky prompt with the trained `sksz.` token removed (a base model has no
  # trigger token); rows carry `use_reference: false`, so neither arm is ever shown the demo.
  base_prompt_ctt:
    kind: base
    adapter: null
    targets: null
    conditioning: none
    note: "prompt only (transition described in text), no prefix/suffix, no reference. Baseline 1."
  base_cond_ctt:
    kind: base
    adapter: null
    targets: null
    note: "prompt + endpoint conditioning (prefix, and suffix if two-sided), no reference.
      Baseline 2 — the honest no-adapter twin of the IC-LoRA arms."

  # ---- metric-eval campaign (2026-08-06): NEUTRAL no-demo controls = the specificity ZERO anchor
  # AND the caption V-neutral probe. Same as base_*_ctt but prompt = V-neutral (start scene only,
  # sksz + effect clause BOTH removed), no demo. base_cond_neutral keeps endpoint conditioning;
  # base_prompt_neutral is unconditional. Rows via --extra-registry (arm-filtered).
  base_cond_neutral:
    kind: base
    adapter: null
    targets: null
    note: "endpoint conditioning + V-neutral prompt, NO effect clause, NO demo. The specificity zero anchor."
  base_prompt_neutral:
    kind: base
    adapter: null
    targets: null
    conditioning: none
    note: "V-neutral prompt only, no conditioning, no demo. Cleanest zero."

  # --- controllability probe (misc/2026-08-13_controllability, pre-registered) ---
  ctt_v3_ctl:
    kind: generalist
    targets: attn_ffn
    step: 6000
    attention: one_way
    adapter_template: store/runs/008_ctt_v3_wsd/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "champion, controllability probe rows (registry_ctl_ctt_v3). rank/alpha 128."
  ctt_v2_ctl:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    adapter_template: store/runs/002_ctt_v2/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "ctt_v2 comparison arm, controllability probe rows. rank/alpha 128."
  base_ctl:
    kind: base
    adapter: null
    targets: null
    note: "base LTX-2, controllability probe rows (effect prompts + endpoint conditioning, NO demo)."

  spec_animalization:      {kind: specialist, class: animalization,      targets: attn, step: 2000}
  spec_color_rain:         {kind: specialist, class: color_rain,         targets: attn, step: 2000}
  spec_gas_transformation: {kind: specialist, class: gas_transformation, targets: attn, step: 2000}
  spec_hero_flight:        {kind: specialist, class: hero_flight,        targets: attn, step: 2000}
  spec_illustration_scene: {kind: specialist, class: illustration_scene, targets: attn, step: 2000}
  spec_polygon:            {kind: specialist, class: polygon,            targets: attn, step: 2000}
  spec_portal:             {kind: specialist, class: portal,             targets: attn, step: 2000}
  spec_shadow:             {kind: specialist, class: shadow,             targets: attn, step: 2000}
  spec_shadow_smoke:       {kind: specialist, class: shadow_smoke,       targets: attn, step: 2000}
  spec_super_fast_run:     {kind: specialist, class: super_fast_run,     targets: attn, step: 2000}
  spec_wireframe:          {kind: specialist, class: wireframe,          targets: attn, step: 2000}

  ic_gen:
    kind: generalist
    targets: attn_ffn
    step: 5000
    note: IC-LoRA; the reference clip carries the transition. Trained on held-in classes only.

  # ---- metric-eval campaign (2026-08-06): the missing adapter x text 2x2 cell = ic_gen + effect-in-prompt.
  # ADDITIVE — ic_gen above is untouched. SAME adapter as ic_gen (explicit path so a new arm name does not
  # break adapter_template); the ONLY difference vs ic_gen is the prompt (effect clause after the sksz token,
  # supplied via --extra-registry registry_ic_gen_effect.jsonl). bidirectional ref attention (ic_gen default),
  # rank/alpha 32. Twin of the effect-free ic_gen; scored against ctt_v2 / ctt_v2_leaky for the 2x2.
  ic_gen_effect:
    kind: generalist
    targets: attn_ffn
    adapter: outputs/training/ladder2/ic_gen/checkpoints/lora_weights_step_05000.safetensors
    note: "ic_gen adapter, effect described in prompt (the missing adapter x text 2x2 cell)."

  # ---- exp_077: the D2 generalist. ADDITIVE — ic_gen above is untouched, and this arm's rows
  # live in registry_d2gen.jsonl (a field-for-field copy of ic_gen's four claim cells with only
  # `arm` and `item_id` renamed), so registry.jsonl stays frozen.
  # The RECIPE is identical to ic_gen (rank 32 / alpha 32 / dropout 0, attn_ffn, lr 2e-4, 5000
  # steps, reference+mask+cond_clean, bf16, batch 1, seed 42) — verified against both
  # training_config.yaml files. ONLY THE TRAINING DATA DIFFERS. `adapter` is an explicit path
  # because this run lives outside outputs/training/ladder2/ (adapter_template's tree).
  d2_gen:
    kind: generalist
    targets: attn_ffn
    step: 5000
    adapter: outputs/training/exp_077_synth_stratum/d2_gen/checkpoints/lora_weights_step_05000.safetensors
    note: "IC-LoRA trained on the rebuilt 50/50 synthetic+real corpus (exp_077). Same
      conditioning and inference settings as ic_gen; measured self-relative against it."

# adapter path template for trained arms (filled by run_gen.py)
  # ---- exp_078 operator-token bottleneck (campaign `bneck`). Trains outside the ladder2 tree,
  # so it carries its own adapter_template. `bottleneck` tells run_gen to rebuild the encoder
  # from the same checkpoint file and route the demo through it.
  b1:
    kind: generalist
    adapter: bneck
    targets: attn_ffn
    step: 5000
    adapter_template: outputs/training/bneck/{arm}/checkpoints/lora_weights_step_{step:05d}.safetensors
    bottleneck: {token_shape: [6, 4, 3], width: 512, depth: 2, num_heads: 8,
                 prefix_latent_frames: 2, suffix_latent_frames: 1}

  b1r:
    kind: generalist
    adapter: bneck
    targets: attn_ffn
    step: 5000
    adapter_template: outputs/training/bneck/{arm}/checkpoints/lora_weights_step_{step:05d}.safetensors
    bottleneck: {token_shape: [6, 4, 3], width: 512, depth: 2, num_heads: 8,
                 prefix_latent_frames: 2, suffix_latent_frames: 1, skip_scale: 1.68}
  m1lite:
    kind: generalist
    adapter: bneck
    targets: attn_ffn
    step: 5000
    ref_downscale: 5
    adapter_template: outputs/training/bneck/{arm}/checkpoints/lora_weights_step_{step:05d}.safetensors

  # ---- CTT v2 IC-LoRA (campaign `ctt_v2`, trained on eps 8xH100 2026-07-29). Uses the global
  # adapter_template, so 05_gen.sh symlinks the checkpoint into
  # outputs/training/ladder2/ctt_v2/checkpoints/.
  # `attention: one_way` is REQUIRED, not cosmetic: this adapter is the first one trained with
  # one-way reference attention, and ReferenceConditionConfig defaults to bidirectional. Running
  # it bidirectionally is a train/inference mismatch. Every earlier arm omits the key and so
  # keeps the bidirectional default it was trained with.
  # rank/alpha are 128 — pass --rank 128 --alpha 128 (run_gen.py's flags default to 32). This
  # line said 256 until 2026-07-31; the run was valve-demoted to 128 before it started
  # (ctt_v2_training/RUN_RECORD.md §2 and §7) and the shipped checkpoint's lora_A tensors
  # measure 128, so 256 was never true of the weights anyone generated with.
  ctt_v2:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    note: "IC-LoRA on the CTT v2 dataset (56,368 pairs, 1,670 operators, 5 strata). rank 128,
      lr 1e-4, one-way reference attention, mix S0 5 / S1 12 / S2a 34.36 / S2b 35.64 / S4 13."

  ctt_v2_pushA_effect:
    kind: generalist
    targets: attn_ffn
    step: 6000
    attention: one_way
    adapter_template: store/runs/008_ctt_v3_wsd/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "ctt_v3 champion adapter, EFFECT prompt (registry_ctt_v2_pushA_effect). Primary: vs ctt_v2_leaky_regen."
  ctt_v2_pushB_effect:
    kind: generalist
    targets: attn_ffn
    step: 6000
    attention: one_way
    adapter_template: store/runs/009_pushB_wsd_hs302050/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "Arm B (+high-sigma) adapter, EFFECT prompt. B's last audition."
  ctt_v2_pushA_plain:
    kind: generalist
    targets: attn_ffn
    step: 6000
    attention: one_way
    adapter_template: store/runs/008_ctt_v3_wsd/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "ctt_v3 champion, PLAIN prompt, DeltaAI regen (co-located 2x2 cell)."
  ctt_v2_leaky_regen:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    adapter_template: store/runs/002_ctt_v2/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "ctt_v2 champion adapter, EFFECT prompt, DeltaAI regen = the co-located leaky baseline (vs published 91.3 eps-gen)."
  ctt_v2_plain_regen:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    adapter_template: store/runs/002_ctt_v2/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "ctt_v2 champion adapter, PLAIN prompt, DeltaAI regen (co-located 2x2 cell; vs published 82.5 eps-gen)."

  # ---- DUAL-FORCE control arm (campaign `dualforce`, trained on DeltaAI GH200 this session, job 2975760).
  # The plain-FM CONTROL: the ctt_v2 IC-LoRA recipe warm-started from runs/002@10000 with the dual-force
  # trainer's surgery/KD objectives DISABLED (surgery.enabled=false, kd.enabled=false). Registered at the
  # STEP-1000 checkpoint. Architecturally identical to ctt_v2/ctt_v3 (960 plain LoRA tensors, r128, attn_ffn,
  # no encoder/bottleneck) — generated with the same proven one_way stack (src/LTX-2-ctt-v2-train packages).
  # `adapter` is an EXPLICIT store path (--step cannot override; step lives in run/gen meta). Two variant keys
  # (neutral/effect) share one checkpoint — canonical arm `dualforce_control` (store/ARMS.md).
  # rank/alpha 128 — pass --rank 128 --alpha 128 (run_gen defaults to 32). attention one_way REQUIRED.
  dualforce_control_neutral:
    kind: generalist
    targets: attn_ffn
    step: 1000
    attention: one_way
    adapter: store/runs/012_dualforce_control/checkpoints/lora_weights_step_01000.safetensors
    note: "dual-force plain-FM control, NEUTRAL prompt (registry_dualforce_control_neutral). runs/012@1000, r128/a128, one_way."
  dualforce_control_effect:
    kind: generalist
    targets: attn_ffn
    step: 1000
    attention: one_way
    adapter: store/runs/012_dualforce_control/checkpoints/lora_weights_step_01000.safetensors
    note: "dual-force plain-FM control, EFFECT prompt (registry_dualforce_control_effect). runs/012@1000, r128/a128, one_way."

  # ---- DUAL-FORCE treatment arm (campaign `dualforce`, trained on DeltaAI GH200 this session, job 2976278).
  # The text-crutch-distillation TREATMENT: the SAME ctt_v2 IC-LoRA recipe / SAME warm-start (runs/002@10000) as
  # dualforce_control above, with the dual-force trainer's KD objective ENABLED (kd.enabled=true, surgery.enabled=false).
  # KD = text-crutch self-distillation — an effect-TEACHER (conditions_effect; derive_effect_from=null) supervises the
  # neutral-STUDENT with λ_target 0.3 in the high-σ band (high_band_sigma 0.7, warmup 500). The ONLY delta vs the control
  # is the training objective; the checkpoint is byte-for-byte a plain r128 attn_ffn LoRA (960 tensors, no encoder/bottleneck),
  # so it GENERATES exactly like the control — same one_way stack (src/LTX-2-ctt-v2-train packages), --rank 128 --alpha 128.
  # `adapter` is an EXPLICIT store path (--step cannot override; step lives in run/gen meta). Canonical arm `dualforce_kd`.
  dualforce_kd_neutral:
    kind: generalist
    targets: attn_ffn
    step: 1000
    attention: one_way
    adapter: store/runs/013_dualforce_kd/checkpoints/lora_weights_step_01000.safetensors
    note: "dual-force text-crutch KD treatment, NEUTRAL prompt (registry_dualforce_kd_neutral). runs/013@1000, r128/a128, one_way."
  dualforce_kd_effect:
    kind: generalist
    targets: attn_ffn
    step: 1000
    attention: one_way
    adapter: store/runs/013_dualforce_kd/checkpoints/lora_weights_step_01000.safetensors
    note: "dual-force text-crutch KD treatment, EFFECT prompt (registry_dualforce_kd_effect). runs/013@1000, r128/a128, one_way."

  # ---- COUNTERFACTUAL-TWIN treatment arm (campaign `counterfactual_training`, trained DeltaAI GH200, job 2982505).
  # Counterfactual twin supervision: SAME ctt_v2 IC-LoRA recipe / SAME warm-start (runs/002@10000) as
  # dualforce_control/kd, with the trainer's twin objective ENABLED (redirect + differential on S2 same-endpoint
  # counterfactuals; band σ∈[0.5,0.9]; surgery/kd OFF). The ONLY delta vs the control is the training objective;
  # the checkpoint is byte-for-byte a plain r128 attn_ffn LoRA (960 tensors, no encoder/bottleneck) — so it
  # GENERATES exactly like the control — same one_way stack, --rank 128 --alpha 128. Canonical arm `dualforce_twin`.
  dualforce_twin_neutral:
    kind: generalist
    targets: attn_ffn
    step: 1000
    attention: one_way
    adapter: store/runs/014_dualforce_twin/checkpoints/lora_weights_step_01000.safetensors
    note: "counterfactual-twin treatment, NEUTRAL prompt (registry_dualforce_twin_neutral). runs/014@1000, r128/a128, one_way."

  # ---- campaign 2026-08-20_s0s1_counterfactual: the REDESIGNED redirect on S0+S1 (runs/015, job 2988156).
  # Single-variable over 012: 012's objective/sampler/warm-start PLUS a redirect-only twin term on
  # same-content×different-operator S0+S1 cells (L_diff dropped, matched=pure FM, cond_A, seam-masked,
  # σ_red∼U[0.5,0.9], λ_red 0.25). Plain r128 attn_ffn LoRA → same one_way inference stack. --rank 128 --alpha 128.
  dualforce_s0s1redirect_neutral:
    kind: generalist
    targets: attn_ffn
    step: 1000
    attention: one_way
    adapter: store/runs/015_dualforce_s0s1redirect/checkpoints/lora_weights_step_01000.safetensors
    note: "S0+S1 counterfactual redirect treatment, NEUTRAL prompt (registry_dualforce_s0s1redirect_neutral). runs/015@1000, r128/a128, one_way."

  # ---- campaign `bneck_coupling` (2026-07-31). The certified transition encoder, FROZEN, coupled
  # into the same CTT v2 IC-LoRA recipe as `ctt_v2` above. The ONLY delta versus `ctt_v2` is the
  # content of the reference channel: the raw full-resolution demo latents are replaced by the
  # encoder's 72 operator tokens (BottleneckConfig REPLACES the raw reference; it does not augment
  # it), so any operator signal that survives must have travelled through those 72 tokens.
  # Everything else — rank 128/alpha 128, attn_ffn, lr 1e-4, one_way, stratum mix, prompts — is held
  # byte-identical, which is what makes the ctt_v2 comparison a controlled contrast.
  # Design lock: misc/bneck_coupling/advisors/A5_SYNTHESIS_DESIGN_LOCK_VERBATIM.md.
  #
  # rank/alpha 128 — pass --rank 128 --alpha 128 (run_gen.py defaults to 32).
  # `attention: one_way` is REQUIRED for the same reason as ctt_v2: trained one-way, and
  # ReferenceConditionConfig defaults to bidirectional.
  # The `bottleneck` block is what makes run_gen reconstruct and attach the encoder; run_gen
  # REFUSES to generate under this arm name if the checkpoint carries no operator_encoder.* tensors,
  # which is the provenance guard that stops raw-reference videos being labelled bottleneck ones.
  bneck_frozen:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    bottleneck:
      token_shape: [6, 4, 3]        # K = 72 tokens; the certified shape. NOT free — the reference
                                    # path requires target_h//H == target_w//W and (F-1)%(f-1)==0.
      width: 512
      depth: 2
      num_heads: 8
      prefix_latent_frames: 2       # the CERTIFIED segment marking, fixed (2,1) for EVERY clip
      suffix_latent_frames: 1       # regardless of sidedness — see bneck_contract.py term 3.
      skip_scale: 0.0               # pinned: >0 injects a raw pooled demo thumbnail, i.e. exactly
                                    # the appearance residue the mandated import check polices.
    note: "Frozen certified transition encoder (armPm_seed42, sha d2b22693) replacing the raw
      reference. Same recipe as ctt_v2 in every other respect."

  # The load-bearing corpse: the SAME adapter file, the same rows, the same seeds — only the clip
  # fed to the encoder changes, via each row's `code_source_reference` (a class-level derangement).
  # The row's own `reference` is untouched, so run_eval.pool_refs() builds a byte-identical GT pool
  # for both twins and the paired delta is uncontaminated. This is a GENERATION-only arm: it pins
  # bneck_frozen's checkpoint and is never trained.
  bneck_frozen_shufcode:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    # Points at the TREATMENT's checkpoint via the supported per-arm adapter_template override
    # (run_gen.py:138). The arm name must still be distinct — run_gen.load_rows filters the
    # registries by arm, so sharing a name would pull the treatment's rows in too.
    adapter_template: outputs/training/ladder2/bneck_frozen/checkpoints/lora_weights_step_{step:05d}.safetensors
    bottleneck:
      token_shape: [6, 4, 3]
      width: 512
      depth: 2
      num_heads: 8
      prefix_latent_frames: 2
      suffix_latent_frames: 1
      skip_scale: 0.0
    note: "Shuffled-code corpse of bneck_frozen. Same adapter, deranged code source. Its PASSING
      (scoring ~= bneck_frozen) is what proves the channel is dead."

  # ---- CALIBRATOR B, the must-ALIVE anchor (design lock line 67, specified by A10; never measured
  # until now). The incumbent `ctt_v2` with its RAW reference deranged by the SAME map the corpse
  # arm uses. A raw-demo swap is KNOWN to move the output, so an instrument that cannot see this
  # move cannot be trusted to call the bottleneck DEAD. Requirement: R_pos >= 0.5.
  # These clips are PIXEL-MEASURED ONLY and are never scored, never registered in `store/evals`,
  # and never joined to a GT pool — which is why re-pointing the reference is harmless here and
  # forbidden everywhere else. No `bottleneck` block: this arm feeds the full-resolution demo, and
  # that is the entire point of it.
  ctt_v2_shufref:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way          # ctt_v2 was trained one-way; the default is bidirectional.
    adapter_template: outputs/training/ladder2/ctt_v2/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "Calibrator B / must-ALIVE anchor. ctt_v2's own adapter, raw reference deranged. Pixel
      measurement only — never scored."

  # ---- campaign `bneck_redesign` RIDE-ALONGS (advisors/DESIGN_LOCK.md §3). All three pin an
  # EXISTING checkpoint via a per-arm adapter_template override and are GENERATION-only (never
  # trained). rank/alpha 128 — pass --rank 128 --alpha 128 (run_gen.py defaults to 32).

  # RAW-reference paired-read control — the BAND-SETTER. The incumbent ctt_v2 IC-LoRA with its
  # NORMAL raw reference. MATCHED = the row's own reference. The deranged twin is a separate arm
  # (below) that re-points ONLY the model-fed clip via `code_source_reference`, leaving `reference`
  # (the GT-pool key run_eval.pool_refs() bans) untouched, so both twins score against a
  # byte-identical pool. No `bottleneck` block: full-resolution demo path, exactly like ctt_v2.
  ctt_v2_rawpair:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way          # ctt_v2 was trained one-way; the default is bidirectional.
    adapter_template: outputs/training/ladder2/ctt_v2/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "RAW-reference control MATCHED. ctt_v2 adapter, row's own reference. Band-setter for the
      redesign's P1/P2 bars (DESIGN_LOCK §3)."

  ctt_v2_rawpair_shufref:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    adapter_template: outputs/training/ladder2/ctt_v2/checkpoints/lora_weights_step_{step:05d}.safetensors
    note: "RAW-reference control DERANGED. Same ctt_v2 adapter; each row's raw reference is
      class-deranged via `code_source_reference` (the SAME shufcode_map table the bneck corpse
      used). `reference` untouched -> byte-identical GT pool. The matched twin's corpse."

  # D3 RoPE position-shuffle rider. The existing 004_bneck_frozen bottleneck LoRA in its normal
  # reference/RoPE path; run_gen's --posshuf-seed 1234 permutes the 72 operator tokens' grid-cell
  # assignment BEFORE RoPE positions are stamped (content otherwise identical). Pixel-measured only,
  # never scored. The `bottleneck` block is byte-identical to bneck_frozen — run_gen rebuilds and
  # attaches the same frozen encoder, then the position-shuffle hook reorders the 72 cells.
  bneck_frozen_posshuf:
    kind: generalist
    targets: attn_ffn
    step: 10000
    attention: one_way
    adapter_template: outputs/training/ladder2/bneck_frozen/checkpoints/lora_weights_step_{step:05d}.safetensors
    bottleneck:
      token_shape: [6, 4, 3]
      width: 512
      depth: 2
      num_heads: 8
      prefix_latent_frames: 2
