<meta charset="utf-8">
<title>IC-LoRA arms — neutral / effect</title>
<style>
:root{--bg:#0e1014;--card:#171a1f;--card2:#1d2127;--edge:#2a2f37;--edge2:#3a414c;
 --fg:#dde3ea;--dim:#8b95a1;--dim2:#666f7a;
 --pre:#2dd4bf;--suf:#f5a524;--ref:#a78bfa;--bad:#f2555a;--good:#4ade80;--warn:#fbbf24;
 --sel:#3b82f6;
 --cat-baseline:#8b95a1;--cat-generalist:#60a5fa;--cat-bottleneck:#a78bfa;--cat-external:#e8d49a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);overflow-x:hidden;
 font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,h4,h5{margin:0;font-weight:600}
a{color:var(--sel)}
.wrap{max-width:1900px;margin:0 auto;padding:16px}
header{border-bottom:1px solid var(--edge);padding-bottom:10px;margin-bottom:14px}
header h1{font-size:19px;letter-spacing:.2px}
header .sub{color:var(--dim);font-size:12px;margin-top:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
details.prov{margin-top:6px;font-size:11px;color:var(--dim)}
details.prov>summary{cursor:pointer;user-select:none;color:var(--dim2)}
details.prov .pline{margin:3px 0 0 14px}

/* ---------------------------------------------------------------- panels + matrix */
.panel{background:var(--card);border:1px solid var(--edge);border-radius:10px;
 padding:14px;margin-bottom:14px}
.panel>h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
 margin-bottom:10px}
.mx{border-collapse:separate;border-spacing:4px;width:100%;max-width:900px}
.mx th,.mx td{padding:0}
.mx .corner{width:150px}
.mx th.ch,.mx th.rh{background:var(--card2);border:1px solid var(--edge);border-radius:7px;
 padding:7px 9px;cursor:pointer;font-size:11px;font-weight:600;text-align:left;
 color:var(--fg);user-select:none;transition:.12s}
.mx th.ch{text-align:center}
.mx th span{display:block;font-weight:400;color:var(--dim2);font-size:10px;margin-top:2px}
.mx th.ch:hover,.mx th.rh:hover{border-color:var(--edge2);background:#232830}
.mx td.c{background:var(--card2);border:1px solid var(--edge);border-radius:7px;
 padding:10px 6px;text-align:center;cursor:pointer;user-select:none;transition:.12s}
.mx td.c .n{font-size:17px;font-weight:600}
.mx td.c .l{font-size:10px;color:var(--dim2);margin-top:1px}
.mx td.c:hover{border-color:var(--edge2)}
.mx td.c.on{background:#132b4d;border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.mx td.c.on .l{color:#9dc4f5}
.mx td.c.empty{opacity:.28;cursor:default}
.mxbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;position:relative}
.btn{background:var(--card2);border:1px solid var(--edge);color:var(--fg);border-radius:6px;
 padding:5px 10px;cursor:pointer;font-size:11px;font-family:inherit}
.btn:hover{border-color:var(--edge2)}
.btn.on{background:#132b4d;border-color:var(--sel)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
.seg button{background:var(--card2);border:0;border-right:1px solid var(--edge);color:var(--dim);
 padding:5px 10px;cursor:pointer;font-size:11px;font-family:inherit}
.seg button:last-child{border-right:0}
.seg button.on{background:#132b4d;color:var(--fg)}
.lbl{color:var(--dim);font-size:11px}

/* ---------------------------------------------------------------- arm dropdown */
.armwrap{position:relative;display:inline-block}
#armbtn{font-weight:600}
#armpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:50;width:560px;max-width:88vw;
 max-height:70vh;overflow-y:auto;background:#14171c;border:1px solid var(--edge2);
 border-radius:10px;box-shadow:0 10px 34px #000a;padding:10px;display:none}
#armpanel.open{display:block}
.aptool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:8px;
 border-bottom:1px solid var(--edge);margin-bottom:8px;position:sticky;top:-10px;
 background:#14171c;padding-top:2px;z-index:2}
.aptool .sp{flex:1}
.apx{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:2px 6px}
.apx:hover{color:var(--fg)}
.apcat{border:1px solid var(--edge);border-radius:8px;margin-bottom:8px;overflow:hidden}
.apcat>.ch{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--card2);
 font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.apcat>.ch .cdot{width:8px;height:8px;border-radius:2px;flex:none}
.apcat>.ch .sp{flex:1}
.apcat>.ch button{background:none;border:1px solid var(--edge);border-radius:4px;color:var(--dim);
 cursor:pointer;font-size:10px;padding:1px 6px}
.apcat>.ch button:hover{color:var(--fg);border-color:var(--edge2)}
.aparm{display:flex;align-items:baseline;gap:8px;padding:5px 9px;border-top:1px solid #20242b;
 flex-wrap:wrap}
.aparm .an{flex:0 0 175px;font-size:11.5px;color:var(--fg)}
.pillrow{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--edge2);
 background:#12151b;color:var(--dim);cursor:pointer;user-select:none;font-weight:600;transition:.1s}
.pill:hover{border-color:var(--sel);color:var(--fg)}
.pill.v-neutral.on{background:#0e2f26;border-color:#1c6b57;color:#5eead4}
.pill.v-effect.on{background:#33240a;border-color:#7a5410;color:#fbbf24}
.pill.v-control.on{background:#241b33;border-color:#4a3d6b;color:#c4b5fd}

/* ---------------------------------------------------------------- metrics table */
.tw{overflow-x:auto}
table.d{border-collapse:collapse;width:100%;font-size:11.5px;white-space:nowrap}
table.d th,table.d td{padding:4px 9px;text-align:right;border-bottom:1px solid #22262d}
table.d th{color:var(--dim);font-weight:600;text-align:right;position:sticky;top:0;
 background:var(--card);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
 cursor:pointer;user-select:none}
table.d th:hover{color:var(--fg)}
table.d th .sar{color:var(--sel);margin-left:2px}
table.d td:first-child,table.d th:first-child,
table.d td.l,table.d th.l{text-align:left}
table.d tbody tr:hover{background:#1e232a}
table.d .num{font-family:ui-monospace,Menlo,monospace}
.mut{color:var(--dim2)}
.catbar{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:7px;
 vertical-align:-2px}
.vtag{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;
 margin-left:6px;text-transform:lowercase}
.vtag.v-neutral{background:#0e2f26;color:#5eead4;border:1px solid #1c6b57}
.vtag.v-effect{background:#33240a;color:#fbbf24;border:1px solid #7a5410}
.vtag.v-control{background:#241b33;color:#c4b5fd;border:1px solid #4a3d6b}
.badge{display:inline-block;font-size:9px;letter-spacing:.06em;padding:1px 5px;border-radius:3px;
 background:#3a2a12;color:var(--warn);border:1px solid #5a4420;vertical-align:middle}
.empty{padding:36px;text-align:center;color:var(--dim2)}
.more{padding:12px;text-align:center}

/* ---------------------------------------------------------------- cards */
.card{background:var(--card);border:1px solid var(--edge);border-radius:10px;
 margin-bottom:12px;overflow:hidden;min-width:0;max-width:100%}
.chead{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#13161b;
 border-bottom:1px solid var(--edge);flex-wrap:wrap}
.chead b{font-size:13px}
.chead .dim{color:var(--dim);font-size:11px}
.chead .pill2{margin-left:auto}
.pbtn{background:#132b4d;border:1px solid var(--sel);color:#cfe2fb;border-radius:5px;
 padding:3px 9px;cursor:pointer;font-size:10.5px;font-family:inherit}
.grp{padding:10px 12px}
.row{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;overflow-y:hidden;
 padding-bottom:6px;align-items:stretch}
.row::-webkit-scrollbar{height:9px}
.row::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:5px}
.row::-webkit-scrollbar-track{background:#0d0f13}
.band{display:flex;gap:10px;flex:0 0 auto;align-items:stretch}
.out-band{border-left:2px dashed var(--edge2);margin-left:6px;padding-left:12px}
.cellbox{flex:0 0 210px;background:var(--card2);border:1px solid var(--edge);border-radius:8px;
 padding:8px;display:flex;flex-direction:column;gap:6px}
.cellbox.wide{flex:0 0 320px}
.cellbox.in{background:#111c22;border-color:#1e3a44}
.cellbox.ctxbox{background:#17181c;border-color:#2b2f36;opacity:.9}
.cellbox.blank{background:transparent !important;border:1px dashed #2a3038 !important;
 opacity:.55;justify-content:center;min-height:150px}
.cellbox.blank .bl{color:var(--dim2);font-size:10px;text-align:center;line-height:1.5}
.cellbox.blank .bl b{color:var(--dim);font-weight:600;display:block;font-size:10.5px;margin-bottom:3px}
.cellbox h4{font-size:11px;line-height:1.35}
.cellbox h4 .arm{color:var(--dim);font-weight:400;display:block;font-size:10px}
.cellbox video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;border-radius:5px;
 display:block}
.cellbox .miss{width:100%;aspect-ratio:3/4;display:grid;place-items:center;color:var(--dim2);
 background:#0b0d10;border-radius:5px;font-size:11px}
.cellbox .fn{color:var(--dim2);font-size:10px;word-break:break-all;line-height:1.35}
/* category tints on output cells — data-driven, no per-arm classes */
.cellbox.out.cat-baseline{background:#15171a;border-color:#3d444d}
.cellbox.out.cat-generalist{background:#0f1a25;border-color:#274d75}
.cellbox.out.cat-bottleneck{background:#171129;border-color:#3d2f66}
.cellbox.out.cat-external{background:#1b1710;border-color:#5a4a22}

/* prompt chips (input bag) + dots (cells) */
.pchip{display:flex;align-items:flex-start;gap:6px;margin:3px 0}
.pdot{flex:none;font-size:9.5px;font-weight:700;font-family:ui-monospace,Menlo,monospace;
 border-radius:4px;padding:1px 5px;border:1px solid;color:#0b0d10;margin-top:1px}
.ptxt{font-size:11px;color:#c7d0da;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ptxt.openp{-webkit-line-clamp:unset}
.chips{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.chip{font-size:9.5px;padding:1px 5px;border-radius:4px;border:1px solid var(--edge);
 color:var(--dim);background:#14171c;font-family:ui-monospace,Menlo,monospace}
.chip b{color:var(--fg);font-weight:600}
.chip.big{font-size:11px;padding:2px 7px}
.chip.r{border-color:#5c2426;color:var(--bad)}
.chip.a{border-color:#5c4a1c;color:var(--warn)}

/* conditioning bar + ref ribbon (ported) */
.cond{border:1px solid var(--edge);border-radius:5px;overflow:hidden;background:#0b0d10}
.cond .track{display:flex;height:12px;position:relative}
.cond .seg-p{background:linear-gradient(180deg,#2dd4bf,#14a89a)}
.cond .seg-s{background:linear-gradient(180deg,#f5a524,#c47f10)}
.cond .seg-g{flex:1;background:repeating-linear-gradient(-45deg,#1b1f26 0 5px,#141820 5px 10px)}
.cond .seg-n{flex:1;background:repeating-linear-gradient(-45deg,#22262d 0 5px,#191d23 5px 10px)}
.cond .cap{display:flex;justify-content:space-between;padding:2px 6px;font-size:9px;
 letter-spacing:.03em;font-weight:600;text-transform:uppercase}
.cond .cap .p{color:var(--pre)}
.cond .cap .s{color:var(--suf)}
.cond .cap .g{color:var(--dim2);font-weight:400;text-transform:none;letter-spacing:0}
.cond .cap .none{color:var(--dim);font-weight:600}
.refbar{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:5px;
 background:#1e1a33;border:1px solid #3b3163;font-size:10px;color:#c9bcf5;font-weight:600}
.refbar.mismatch{background:#2c1618;border-color:#5c2426;color:#f0a7ab}
.refbar.none{background:#14171c;border-color:var(--edge);color:var(--dim2)}
.refbar .clip{font-weight:400;color:#9b8fd0;font-family:ui-monospace,Menlo,monospace;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refbar.mismatch .clip{color:#d1898e}
</style>

<div class="wrap">
<header>
  <h1>IC-LoRA arms — neutral / effect</h1>
  <div class="sub" id="sub"></div>
  <details class="prov"><summary>provenance</summary><div id="prov"></div></details>
</header>

<div class="panel">
  <h2>selection</h2>
  <table class="mx" id="mx"></table>
  <div class="mxbar">
    <button class="btn" onclick="selAll(1)">select all</button>
    <button class="btn" onclick="selAll(0)">clear</button>
    <span class="armwrap">
      <button class="btn" id="armbtn" onclick="togPanel(event)">arms ▾</button>
      <div id="armpanel"></div>
    </span>
    <span class="lbl" style="margin-left:6px">seed</span>
    <span class="seg" id="seeds"></span>
    <span class="lbl" style="margin-left:6px">donor class</span>
    <select id="donor" class="btn"></select>
    <span class="lbl" id="selinfo" style="margin-left:auto"></span>
  </div>
</div>

<div class="panel">
  <h2>metrics — selected arms × selected ontology cells</h2>
  <div id="stats"></div>
</div>

<div class="panel">
  <h2 style="display:flex;align-items:center;gap:10px">examples
    <span class="lbl" id="cardinfo" style="text-transform:none;letter-spacing:0"></span></h2>
  <div id="cards"></div>
  <div class="more" id="more"></div>
</div>
</div>

<script>
const D = /*__DATA__*/null;
const PAGE = 25;
let shown = PAGE;

// ---------------------------------------------------------------- helpers (ported)
const keyOf = (n,c) => n+"|"+c;
const fmt = (v,dp=3) => (v==null||!isFinite(v)) ? "—" : v.toFixed(dp);
const pct = v => (v==null||!isFinite(v)) ? "—" : (v*100).toFixed(1)+"%";
const mean = a => { a = a.filter(x=>x!=null&&isFinite(x)); return a.length? a.reduce((s,x)=>s+x,0)/a.length : null; };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const PRIMARY = D.meta.primary_set;

// ---------------------------------------------------------------- arm catalog state
// meta.arm_catalog: [{id,label,arms:[{id,label,entries:[{tier,variant,label}]}]}]
const CATALOG = D.meta.arm_catalog || [];
const CAT_BY_ID = Object.fromEntries(CATALOG.map(c=>[c.id,c]));
const ENTRY_META = {};                            // tier -> {cat, arm, armLabel, variant, label}
for(const c of CATALOG) for(const a of c.arms) for(const e of a.entries)
  ENTRY_META[e.tier] = {cat:c.id, arm:a.id, armLabel:a.label, variant:e.variant, label:e.label};
const KNOWN = new Set(Object.keys(ENTRY_META));

const LS_SEL = "iclne_v2_sel", LS_ORD = "iclne_v2_catorder";
function defaultSel(){
  const s = new Set();
  for(const c of CATALOG){
    if(c.id === "bottleneck") continue;
    for(const a of c.arms){
      const first = a.entries.find(e=>e.variant==="neutral");
      if(first) s.add(first.tier);
    }
  }
  return s;
}
function loadState(){
  let selArr = null, ordArr = null;
  try{ selArr = JSON.parse(localStorage.getItem(LS_SEL)); }catch(e){}
  try{ ordArr = JSON.parse(localStorage.getItem(LS_ORD)); }catch(e){}
  const tiers = (Array.isArray(selArr) ? new Set(selArr.filter(t=>KNOWN.has(t))) : null) || defaultSel();
  const ids = CATALOG.map(c=>c.id);
  let ord = Array.isArray(ordArr) ? ordArr.filter(i=>ids.includes(i)) : [];
  for(const i of ids) if(!ord.includes(i)) ord.push(i);
  return {tiers: (selArr===null ? defaultSel() : tiers), ord};
}
const state = loadState();
let tiers = state.tiers;                       // Set of selected entry tier ids
let catOrder = state.ord;                      // category id order
function saveState(){
  try{
    localStorage.setItem(LS_SEL, JSON.stringify([...tiers]));
    localStorage.setItem(LS_ORD, JSON.stringify(catOrder));
  }catch(e){}
}
// entries in DISPLAY order: category order, then catalog order within
function dispTiers(){
  const out = [];
  for(const cid of catOrder){
    const c = CAT_BY_ID[cid]; if(!c) continue;
    for(const a of c.arms) for(const e of a.entries) out.push(e.tier);
  }
  return out;
}
const selTiers = () => dispTiers().filter(t=>tiers.has(t));

// ---------------------------------------------------------------- ontology matrix (ported)
const sel = new Set();
let seed = String(D.meta.seeds[0]);
let donor = "";
function drawMatrix(){
  const t = document.getElementById("mx");
  let h = "<tr><th class='corner'></th>";
  for(const c of D.content_order)
    h += `<th class="ch" onclick="togCol('${c}')">${D.content_label[c]}</th>`;
  h += "</tr>";
  for(const n of D.novelty_order){
    h += `<tr><th class="rh" onclick="togRow('${n}')">${D.novelty_label[n]}</th>`;
    for(const c of D.content_order){
      const k = keyOf(n,c), cnt = D.matrix[k]||0;
      h += cnt===0
        ? `<td class="c empty"><div class="n">–</div></td>`
        : `<td class="c ${sel.has(k)?"on":""}" onclick="tog('${k}')">
             <div class="n">${cnt}</div><div class="l">rows</div></td>`;
    }
    h += "</tr>";
  }
  t.innerHTML = h;
}
function tog(k){ sel.has(k)?sel.delete(k):sel.add(k); render(); }
function togRow(n){
  const ks = D.content_order.map(c=>keyOf(n,c)).filter(k=>(D.matrix[k]||0)>0);
  const all = ks.every(k=>sel.has(k));
  ks.forEach(k=> all?sel.delete(k):sel.add(k)); render();
}
function togCol(c){
  const ks = D.novelty_order.map(n=>keyOf(n,c)).filter(k=>(D.matrix[k]||0)>0);
  const all = ks.every(k=>sel.has(k));
  ks.forEach(k=> all?sel.delete(k):sel.add(k)); render();
}
function selAll(on){
  sel.clear();
  if(on) for(const k in D.matrix) if(D.matrix[k]>0) sel.add(k);
  render();
}

// ---------------------------------------------------------------- arm dropdown
let panelOpen = false;
function togPanel(ev){
  ev.stopPropagation();
  panelOpen = !panelOpen;
  drawPanel();
}
document.addEventListener("click", e => {
  if(!panelOpen) return;
  if(e.target.closest("#armpanel") || e.target.closest("#armbtn")) return;
  panelOpen = false; drawPanel();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && panelOpen){ panelOpen = false; drawPanel(); }
});
function drawPanel(){
  const p = document.getElementById("armpanel");
  p.classList.toggle("open", panelOpen);
  document.getElementById("armbtn").textContent = `arms (${tiers.size}) ${panelOpen?"▴":"▾"}`;
  if(!panelOpen){ p.innerHTML=""; return; }
  const keepScroll = p.scrollTop;
  let h = `<div class="aptool">
    <button class="btn" onclick="armAll(1)">select all</button>
    <button class="btn" onclick="armAll(0)">clear</button>
    <span class="lbl" style="margin-left:6px" title="bulk variant ops — apply ONLY to arms that already have a selected entry">for chosen arms:</span>
    <button class="btn" onclick="bulkVar('neutral',1)">N on</button>
    <button class="btn" onclick="bulkVar('neutral',0)">N off</button>
    <button class="btn" onclick="bulkVar('effect',1)">E on</button>
    <button class="btn" onclick="bulkVar('effect',0)">E off</button>
    <span class="sp"></span>
    <button class="apx" onclick="panelOpen=false;drawPanel()" title="close">✕</button>
  </div>`;
  catOrder.forEach((cid, i) => {
    const c = CAT_BY_ID[cid]; if(!c) return;
    h += `<div class="apcat"><div class="ch">
        <span class="cdot" style="background:var(--cat-${c.id})"></span>${c.label}
        <span class="sp"></span>
        <button onclick="moveCat(${i},-1)" title="move category up">▲</button>
        <button onclick="moveCat(${i},1)" title="move category down">▼</button></div>`;
    for(const a of c.arms){
      h += `<div class="aparm"><span class="an">${a.label}</span><span class="pillrow">` +
        a.entries.map(e =>
          `<span class="pill v-${e.variant} ${tiers.has(e.tier)?"on":""}"
             onclick="togTier('${e.tier}')">${e.label}</span>`).join("") +
        `</span></div>`;
    }
    h += `</div>`;
  });
  p.innerHTML = h;
  p.scrollTop = keepScroll;
}
function togTier(t){
  tiers.has(t) ? tiers.delete(t) : tiers.add(t);
  saveState(); shown = PAGE; render();
}
function armAll(on){
  tiers = on ? new Set(Object.keys(ENTRY_META)) : new Set();
  saveState(); shown = PAGE; render();
}
// bulk N/E — only over arms that currently have >=1 selected entry ("chosen arms")
function bulkVar(variant, on){
  const engaged = new Set();
  for(const t of tiers){ const m = ENTRY_META[t]; if(m) engaged.add(m.cat+"::"+m.arm); }
  for(const [t, m] of Object.entries(ENTRY_META)){
    if(m.variant !== variant) continue;
    if(!engaged.has(m.cat+"::"+m.arm)) continue;
    if(on) tiers.add(t); else tiers.delete(t);
  }
  saveState(); shown = PAGE; render();
}
function moveCat(i, d){
  const j = i + d;
  if(j < 0 || j >= catOrder.length) return;
  [catOrder[i], catOrder[j]] = [catOrder[j], catOrder[i]];
  saveState(); render();
}

// ---------------------------------------------------------------- filtering
function cardMatches(card){
  const hit = [];
  for(const t of selTiers())
    for(const g of card.slots[t]||[]){
      if(sel.size && !sel.has(keyOf(g.novelty, g.content))) continue;
      if(donor && g.donor !== donor) continue;
      hit.push(g);
    }
  return hit.length ? hit : null;
}
function selectedCards(){
  const out = [];
  for(const card of D.cards){ const hit = cardMatches(card); if(hit) out.push({card, hit}); }
  return out;
}

// ---------------------------------------------------------------- metrics table
function drawStats(){
  const el = document.getElementById("stats");
  const st = selTiers();
  if(!st.length){ el.innerHTML = "<div class='empty'>no arms selected — open the arms menu</div>"; return; }
  const entries = selectedCards();
  if(!entries.length){ el.innerHTML = "<div class='empty'>no rows match the selection</div>"; return; }
  // per selected entry: its gens over the matching cards (ontology + donor filtered)
  const per = {};
  for(const {card} of entries)
    for(const t of st)
      for(const g of card.slots[t]||[]){
        if(sel.size && !sel.has(keyOf(g.novelty, g.content))) continue;
        if(donor && g.donor !== donor) continue;
        (per[t] = per[t] || []).push(g);
      }
  let h = `<div class="tw"><table class="d"><thead><tr>
    <th class="l">arm · variant</th>
    <th>%_same<br><span class="mut" style="font-size:9px">comparable · n</span></th>
    <th>(%_proxy)<br><span class="mut" style="font-size:9px">ranking only · n</span></th>
    <th>raw app_ref</th><th>copy_max ↓</th><th>near_copy ↓</th><th>items</th></tr></thead><tbody>`;
  for(const t of st){
    const gs = per[t] || [];
    const m = ENTRY_META[t];
    const same = gs.filter(g=>g.pct_type==="same").map(g=>g.pct);
    const prox = gs.filter(g=>g.pct_type==="proxy").map(g=>g.pct);
    const bad = [...new Set(gs.map(g=>g.instr).filter(i=>i && i!==PRIMARY))];
    h += `<tr><td class="l"><span class="catbar" style="background:var(--cat-${m.cat})"></span>
        <b>${m.armLabel}</b> <span class="vtag v-${m.variant}">${esc(m.label)}</span>
        ${bad.length?`<span class="badge">${bad.join("/")}</span>`:""}</td>
      <td class="num"><b>${pct(mean(same))}</b> <span class="mut">· ${same.filter(x=>x!=null).length}</span></td>
      <td class="num">${mean(prox)==null?"—":"("+pct(mean(prox))+")"} <span class="mut">· ${prox.filter(x=>x!=null).length}</span></td>
      <td class="num">${fmt(mean(gs.map(g=>g.m.app_ref)),4)}</td>
      <td class="num">${fmt(mean(gs.map(g=>g.m.copy_max)),3)}</td>
      <td class="num">${fmt(mean(gs.map(g=>g.f.near_copy)),3)}</td>
      <td class="num">${gs.length}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  el.innerHTML = h;
}

// ---------------------------------------------------------------- conditioning bar (ported)
function condBar(g){
  const F = D.meta.frames, P = D.meta.px_prefix, S = D.meta.suffix_gen_frames;
  let bar;
  if(g.cond === "none"){
    bar = `<div class="track"><div class="seg-n"></div></div>
           <div class="cap"><span class="none">prompt only — no endpoints</span>
             <span class="g">${F}f generated</span></div>`;
  } else if(g.cond === "external"){
    bar = `<div class="track"><div class="seg-n"></div></div>
           <div class="cap"><span class="none">their contract</span>
             <span class="g">${g.cond_note}</span></div>`;
  } else if(g.cond === "prefix"){
    bar = `<div class="track">
             <div class="seg-p" style="width:${100*P/F}%"></div><div class="seg-g"></div></div>
           <div class="cap"><span class="p">prefix ${P}f</span>
             <span class="g">${F-P}f generated</span></div>`;
  } else {
    bar = `<div class="track">
             <div class="seg-p" style="width:${100*P/F}%"></div><div class="seg-g"></div>
             <div class="seg-s" style="width:${100*S/F}%"></div></div>
           <div class="cap"><span class="p">prefix ${P}f</span>
             <span class="g">${F-P-S}f generated</span><span class="s">suffix ${S}f</span></div>`;
  }
  const ref = g.ref
    ? `<div class="refbar ${g.mismatched_ref?"mismatch":""}">
         <span>${g.mismatched_ref?"✕ wrong demo":"◧ demo"}</span><span class="clip">${g.ref}</span></div>`
    : `<div class="refbar none"><span>ref —</span></div>`;
  return ref + `<div class="cond">${bar}</div>`;
}

// ---------------------------------------------------------------- cards
function vid(src){
  return src ? `<video preload="metadata" muted loop playsinline autoplay
                  data-src="${D.meta.rel}${src}"></video>`
             : `<div class="miss">not available</div>`;
}
const PALETTE = ["#5eead4","#fbbf24","#c4b5fd","#f472b6","#4ade80","#60a5fa","#f2555a","#e8d49a"];

function cardHtml(entry){
  const c = entry.card;
  const st = selTiers();
  // gens per selected entry on this card (unfiltered by ontology within the card — the card
  // already matched; each cell shows what that arm did on this row)
  const cells = [];
  for(const t of st) for(const g of c.slots[t]||[]) cells.push([t, g]);

  // ---- the UNIQUE prompts across the selected cells, colored by first appearance
  const pIdx = new Map();
  for(const [, g] of cells){
    const p = g.prompt;
    if(p && !pIdx.has(p)) pIdx.set(p, pIdx.size);
  }
  const pcolor = i => PALETTE[i % PALETTE.length];
  const bag = [...pIdx.entries()].map(([txt, i]) =>
    `<div class="pchip"><span class="pdot" style="background:${pcolor(i)};border-color:${pcolor(i)}">P${i+1}</span>
       <span class="ptxt" onclick="this.classList.toggle('openp')" title="click to expand">${esc(txt)}</span></div>`).join("");

  // ---- input bag
  const refBoxes = (c.refs||[]).filter(r => cells.some(([,g]) => g.ref === r.clip)).map(r=>
    `<div class="cellbox in" style="border-color:${r.mismatched?'#5c2426':'#3b3163'};background:${r.mismatched?'#1c1113':'#141127'}">
       <h4>${r.mismatched?"✕ WRONG DEMO":"◧ DEMO"} · ${r.cls||"?"}<span class="arm">reference video</span></h4>
       ${vid(r.video)}<div class="fn">${r.clip}</div></div>`).join("");
  const inputs =
    `<div class="cellbox in wide"><h4>PROMPTS<span class="arm">${pIdx.size} unique across the selected arms</span></h4>${
       bag || `<div class="fn">no prompts (no selected arm answers this row)</div>`}</div>` +
    `<div class="cellbox in"><h4>PREFIX · ${D.meta.px_prefix}f<span class="arm">start anchor</span></h4>
       ${vid(c.prefix_video)}</div>` +
    (c.sided==="two"
      ? `<div class="cellbox in"><h4>SUFFIX · ${D.meta.px_prefix}f<span class="arm">end anchor</span></h4>${vid(c.suffix_video)}</div>`
      : `<div class="cellbox in blank"><div class="bl"><b>suffix</b>one-sided<br>no end anchor</div></div>`) +
    refBoxes +
    `<div class="cellbox ctxbox"><h4>ENDPOINT SOURCE<span class="arm">context · not an input</span></h4>
       ${c.endpoint_video?vid(c.endpoint_video):`<div class="miss">DAVIS — off-distribution</div>`}
       <div class="fn">${c.endpoint} · ${c.endpoint_class||"davis"}</div></div>`;

  // ---- output cells: [P# dot] [ref] [endpoints] indicators + video + score
  const outs = cells.map(([t, g])=>{
    const m = ENTRY_META[t];
    const pi = g.prompt!=null && pIdx.has(g.prompt) ? pIdx.get(g.prompt) : null;
    const chips = [
      pi==null ? `<span class="chip">P —</span>`
        : `<span class="pdot" style="background:${pcolor(pi)};border-color:${pcolor(pi)}" title="${esc(g.prompt)}">P${pi+1}</span>`,
    ];
    if(g.scored){
      chips.push(`<span class="chip big">%ceil <b>${pct(g.pct)}</b></span>`);
      chips.push(`<span class="chip">copy <b>${fmt(g.m.copy_max,2)}</b></span>`);
      if(g.f.near_copy>0) chips.push(`<span class="chip r">near_copy ${fmt(g.f.near_copy,2)}</span>`);
      if(g.instr && g.instr!==PRIMARY) chips.push(`<span class="badge">${g.instr}</span>`);
    } else chips.push(`<span class="chip a">unscored</span>`);
    return `<div class="cellbox out cat-${m.cat}">
      <h4>${m.armLabel} <span class="vtag v-${m.variant}">${esc(m.label)}</span>
        <span class="arm">${g.cell} · ${g.novelty}</span></h4>
      ${condBar(g)}
      ${vid(g.videos[seed] || Object.values(g.videos)[0])}
      <div class="chips">${chips.join("")}</div></div>`;
  }).join("");

  return `<div class="card">
    <div class="chead"><b>${c.endpoint}</b>
      <span class="dim">transition <b>${c.donor}</b> · ${c.sided}-sided</span>
      <span class="pill2"><button class="pbtn" onclick="playAll(this)">↻ restart row synced</button></span></div>
    <div class="grp"><div class="row">
      <div class="band">${inputs}</div>
      <div class="band out-band">${outs || `<div class="cellbox blank"><div class="bl"><b>no cells</b>no selected arm<br>answers this row</div></div>`}</div>
    </div></div>
  </div>`;
}

function drawCards(){
  const entries = selectedCards();
  document.getElementById("cardinfo").textContent =
    `${entries.length} transition×endpoint rows · showing ${Math.min(shown,entries.length)}`;
  const el = document.getElementById("cards");
  if(!entries.length){ el.innerHTML = "<div class='empty'>no rows match the selection</div>";
    document.getElementById("more").innerHTML=""; return; }
  el.innerHTML = entries.slice(0,shown).map(cardHtml).join("");
  document.getElementById("more").innerHTML = entries.length>shown
    ? `<button class="btn" onclick="shown+=${PAGE};drawCards()">show ${Math.min(PAGE,entries.length-shown)} more of ${entries.length-shown}</button>` : "";
  lazy();
}

// ---------------------------------------------------------------- video machinery (ported)
let io;
function lazy(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{
    const v = e.target;
    if(e.isIntersecting){ if(!v.src) v.src = v.dataset.src; v.play().catch(()=>{}); }
    else v.pause();
  }), {rootMargin:"300px"});
  document.querySelectorAll("video").forEach(v=>io.observe(v));
}
function playAll(btn){
  const vids = [...btn.closest(".card").querySelectorAll("video")];
  vids.forEach(v=>{ if(!v.src) v.src = v.dataset.src; });
  const go = () => vids.forEach(v=>{ v.currentTime = 0; v.play().catch(()=>{}); });
  const notReady = vids.filter(v=>v.readyState < 1);
  if(!notReady.length){ go(); return; }
  let left = notReady.length;
  notReady.forEach(v=>v.addEventListener("loadedmetadata",
    ()=>{ if(--left === 0) go(); }, {once:true}));
}

// ---------------------------------------------------------------- chrome
function drawControls(){
  document.getElementById("seeds").innerHTML = D.meta.seeds.map(s=>
    `<button class="${String(s)===seed?"on":""}" onclick="setSeed('${s}')">${s}</button>`).join("");
  const donors = [...new Set(D.cards.map(c=>c.donor))].filter(Boolean).sort();
  const d = document.getElementById("donor");
  if(!d.options.length){
    d.innerHTML = `<option value="">all (${donors.length})</option>` +
      donors.map(x=>`<option value="${x}">${x}</option>`).join("");
    d.onchange = e => { donor = e.target.value; shown = PAGE; render(); };
  }
}
function setSeed(s){ seed = s; render(); }

function render(){
  shown = Math.max(shown, PAGE);
  drawMatrix(); drawControls(); drawPanel(); drawStats(); drawCards();
  const n = selectedCards().reduce((s,e)=>s+e.hit.length,0);
  document.getElementById("selinfo").textContent =
    (sel.size ? `${sel.size} ontology cells` : `all ontology cells`) +
    ` · ${tiers.size} arm entries · ${n} generations`;
}

// sortable stats table (ported)
document.addEventListener("click", e => {
  const th = e.target.closest("table.d th");
  if(!th) return;
  const table = th.closest("table"), head = table.tHead.rows[0], body = table.tBodies[0];
  const idx = [...head.cells].indexOf(th);
  const dir = th.dataset.dir === "asc" ? "desc" : "asc";
  [...head.cells].forEach(c => { c.removeAttribute("data-dir"); c.querySelector(".sar")?.remove(); });
  th.dataset.dir = dir;
  const num = td => {
    const t = td.textContent.trim().replace(/[()%,]/g, "").replace(/^\+/, "");
    if(t === "" || t === "—") return null;
    const n = parseFloat(t);
    return isNaN(n) ? t.toLowerCase() : n;
  };
  [...body.rows].map(r => [r, num(r.cells[idx])])
    .sort((a, b) => {
      const x = a[1], y = b[1];
      if(x === null) return 1;
      if(y === null) return -1;
      if(typeof x === "number" && typeof y === "number") return dir === "asc" ? x - y : y - x;
      return dir === "asc" ? String(x).localeCompare(y) : String(y).localeCompare(x);
    })
    .forEach(([r]) => body.appendChild(r));
  const ar = document.createElement("span");
  ar.className = "sar"; ar.textContent = dir === "asc" ? "▲" : "▼";
  th.appendChild(ar);
});

// ---------------------------------------------------------------- header + provenance
const m = D.meta;
document.getElementById("sub").innerHTML =
  `<b class="mono">${m.cards}</b> transition×endpoint tasks · <b class="mono">${m.generations}</b> videos ·
   seeds ${m.seeds.join(", ")} · instrument <span class="mono">${m.instrument}</span> ·
   ${m.frames}f @ prefix ${m.px_prefix} / suffix ${m.suffix_gen_frames}`;
document.getElementById("prov").innerHTML =
  (m.machines||[]).map(x=>`<div class="pline"><span class="mono">${x.arch} · torch ${x.torch} · py ${x.python}</span>
     ${x.primary?"<b>(primary)</b>":""} ← ${x.cols.join(", ")}</div>`).join("") +
  `<div class="pline">score sets: ${(m.score_sets||[]).map(s=>`<span class="mono">${s.id}</span>${s.id===m.primary_set?" (primary)":""}`).join(" · ")}</div>` +
  `<div class="pline">%_same is cross-class comparable; (%_proxy) is ranking-only and never blended.
    copy_max / near_copy are not comparable across frame counts (33f external vs 121f).</div>`;

selAll(1);
</script>
