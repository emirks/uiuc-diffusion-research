notes: >
  T1 rows carry gt_pool_class = the designated operator's class (S1: manner name without the spec_ prefix;
  S2: s2_<shader>), pct_type=same. Each T2 item is TWO rows sharing one generated video (added at stamp time
  via video_key): t2_role=missing (gt_pool_class = swap/missing operator's class, pct_type=proxy) and
  t2_role=designated (gt_pool_class = designated operator's class, pct_type=same). endpoint_class = the
  designated operator's class (the endpoint is that operator's render of the shot). gen_item carries the
  arm-free generation filename stem so stamp-time video_key = "<harness_arm>/<gen_item>" resolves to the clip.
  no_twin is added per arm at stamp time (there is no base twin on this grid).
