# ------------------------------------------------------------------ what makes this a valid corpse
the_intervention: >
  THE ONLY DIFFERENCE from gens/008 is which clip the frozen encoder sees. The mismatch travels in a
  NEW field, `code_source_reference`; the row's own `reference` is left untouched. That separation is
  load-bearing, not cosmetic: run_eval.pool_refs() EXCLUDES the row's own `reference` from the GT
  pool, so swapping `reference` to build the corpse would change pool COMPOSITION between the twins
  and contaminate every paired delta — the same class of keyed-join defect that flipped two cells in
  the earlier ladder audit.
derangement:
  rule: deterministic within-cell derangement over the reference clip's authoritative class
    (prompts.clip_class), never over the row's donor_class
  verified: 152/152 rows mapped, 0 fixed points, 0 same-donor-class assignments
  why_not_donor_class: >
    deranging by donor_class handed 26 rows a code of their OWN class — an accidentally CORRECT code
    inside the corpse — because on G-ref-control the demo is deliberately mismatched. Caught by the
    builder's own assert.
  fallback: >
    2 rows (G-ref-control, two-sided) where the +1 shift necessarily lands on the donor class use a
    documented widened pool — same-sidedness references grid-wide, excluding the donor class and the
    row's own reference. Both recorded by name in the build output.

