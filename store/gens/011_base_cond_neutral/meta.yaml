    would give this arm a different pool than the arms it is read against.
  - >-
    un-twinned by design (`no_twin: true`): it IS a baseline, contributes a LEVEL, never a paired margin.
  - >-
    item_ids are byte-identical to gens/010 + gens/012 (share the ladder2 CTT grid) but do NOT collide
    with eval_ladder/registry.jsonl (0/152). Key on (arm, item_id).
