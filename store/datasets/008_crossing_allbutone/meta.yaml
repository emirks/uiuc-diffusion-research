id: 008_crossing_allbutone
seq: 8
shelf: datasets
created: 2026-09-13
role: >
  Crossing ablation, "ALL BUT ONE" layout — a MATCHED PAIR of from-scratch training sets (crossed vs
  uncrossed) that differ ONLY in how the same shots and operators are laid out. Uncrossed: every shot
  under exactly 1 operator (the shot alone names the operator). Crossed: every shot under all operators
  of its block but ONE; the missing cell rotates and is the T2 probe, shown only through the reference,
  untrained in BOTH models. Supersedes the 007 layout (degree 5 + EffectData degree 2; 007 never consumed).
source: >
  datasets/crossing_allbutone/build_s0s1.py (deterministic, seed 42) over the training-verified manifest
  store/datasets/005_ctt_v2plus_s6reshape/root/samples.jsonl; assemble.py concatenates blocks/ and
  ASSERTS the control. Tensors are COPIED into root/data (self-contained, 4.1 GB; nothing points outside).
root: symlink -> ../../../datasets/crossing_allbutone   # crossed/, uncrossed/, tests/, data/, _mask_store/, blocks/
form: >
  two roots (crossed/, uncrossed/), each samples.jsonl in the 005 row schema with ROOT-RELATIVE paths
  (`data -> ../data`, `_mask_store -> ../_mask_store` per root). Trainer reads ONE root per run.
blocks:
  s0s1:   # BUILT 2026-09-13 — onesided, the 9 dense S1 spec manners
    operators: 9
    crossed:   {shots: 27, operators_per_shot: 8, missing_per_operator: 3}
    uncrossed: {shots: 216, operators_per_shot: 1, designated_per_operator: 3, fresh_per_operator: 21}
    shots_per_operator: 24      # both sets
    refs_per_shot_op: 4         # same operator, different shot, WITHIN the block; rotated (each shot x op is a ref exactly 4x)
    pairs: 864                  # both sets
  s2:     # BUILT 2026-09-13 — twosided, 12 owner-picked gl-transitions shader families on existing S2 endpoint pairs
    operators: 12   # butterflywavescrawler dissolve edgetransition pixelize waterdrop bookflip bowtiewithparameter crosszoom filmburn gridflip fragment pinwheel
    crossed:   {shots: 12, operators_per_shot: 11, missing_per_operator: 1}
    uncrossed: {shots: 132, operators_per_shot: 1, designated_per_operator: 1, fresh_per_operator: 10}
    shots_per_operator: 11
    refs_per_shot_op: 4
    pairs: 528
    topup: >
      208 cells from existing S2a/S2b renders + 44 HOLES rendered fresh (frozen S2 engine, one existing complete op per
      shader, flip none/swap false; CC secondary CPU GL) and encoded on DeltaAI (1 GH200, S2b recipe, twosided suffix
      correction, median suffix_rel_l2 0.327). All 44 byte-exact endpoints + operator-identity gate pass; 41/44 pass the
      visual quality gate (3 seam-flagged, kept: s2x_00_edgetransition s2x_00_gridflip s2x_03_filmburn).
    tests_reference: existing S2 render of the operator on an endpoint OUTSIDE both training sets (novel demonstration)
    provenance: root/s2_topup/{PLAN.json,render_jobs.json,render/meta,encodes/S2X}
contents: >
  1,392 pairs PER SET (s0s1 864 + s2 528); 21 operators (9 onesided S1 manners + 12 twosided S2 shaders).
  CROSSED: 39 shots (27 x 8 operators + 12 x 11) = 348 shot x operators. UNCROSSED: 348 shots x 1 operator.
  Shots per operator: 24 (s0s1) / 11 (s2) in both sets. 657 distinct target tensors, 348 caption-key conditions,
  2 masks; root/data 6.7 GB, self-contained (1,664 distinct files referenced).
control_invariant: >
  operator->pairs, operator->shot x operators and operator->shots histograms are IDENTICAL between crossed and
  uncrossed; crossed shots are a subset of uncrossed shots, each under its designated operator (one of its trained
  operators). The ONLY difference is operators per shot (8 vs 1). Asserted by assemble.py; recorded in BUILD_AUDIT.json.
tests:
  t1_seen: datasets/crossing_allbutone/tests/t1_seen.jsonl   # 39 (27 s0s1 + 12 s2); designated operator, matched reference -> expect tie
  t2_swap: datasets/crossing_allbutone/tests/t2_swap.jsonl   # 39; the MISSING operator via the reference; untrained in both; THE cell
  t3_zeroshot: datasets/crossing_ablation/tests/t3_zeroshot.md  # bonus; grid v3 held-out operators + shots
health: >
  assemble.py all asserts pass with both blocks (pairs 1,392/1,392; operator->pairs/shot x ops/shots histograms
  identical; degree 8 on all 27 s0s1 crossed shots and 11 on all 12 s2 crossed shots; degree 1 on all 348 uncrossed
  shots; crossed subset of uncrossed; references regular 4x; 0 missing paths over 1,664 distinct files). Torch shapes
  sampled both roots/both blocks: latents/reference/cond_clean (128,16,20,15), masks (16,20,15), conditions embeds
  (1024,3840); twosided cond_clean != latents (suffix corrected). GOTCHA fixed during build: S2a/S2b clips share the
  s2_XXXX_cYY stem naming -> copied/row stems are prefixed by stratum (S2a__..., S2b__...).
recipe_planned: >
  BOTH arms identical, from scratch, never warm-started: rank 32 / alpha 32, lr 2e-4, 3,000 steps, batch 1,
  WSD (warmup 100, decay 25%), seed 42 (ic_gen's recipe + the ctt_v3 WSD schedule).
consumers: []    # COMPLETE, not consumed yet — two from-scratch runs (crossed, uncrossed) pending; immutable once they start
docs: ./root/README.md
authority: ./root/BUILD_AUDIT.json (assembled invariants); ./root/blocks/*/audit.json (per block); build_s0s1.py / s2_topup/*.py / assemble.py
