# ─────────────────── ADDENDUM 2026-08-28 · EffectData stratum S6 (append-only) ───────────────────
# Entry 003 extended ADDITIVELY. Everything above this line is frozen/untouched (immutable-by-
# addendum, per NORM_DIRECTIVES.md §6). fable-advisor GO 2026-08-28.
addendum_s6:
