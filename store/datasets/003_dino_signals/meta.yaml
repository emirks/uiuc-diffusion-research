  19,023 per-clip signal fields — the 44-channel DINO-basis operator signal (fp16) on the LTX-2
  latent grid: eval 223, S0 139, S1 1,225, S2a 7,577, S2b 7,859, S4 2,000. Shapes (T,H,W,44) =
  (16,20,15,44) for S0/S1/S2a/S2b/eval, (5,14,26,44) for S4. Channels: G1 pca_00..31 (frozen
  768->32 DINOv2-base PCA state) · G2 u,v,conf,entropy (windowed correspondence transport) · G3
  dF_norm,one_minus_cos (in-place change) · G4 s_A,s_B,nu (endpoint bank-max) · G5 dLab,csim_A,csim_B
  (Lab). Plus dino_raw/ (19,023 raw DINOv2-base patch-token caches, ~483 GB) and pca.npz (frozen PCA).
