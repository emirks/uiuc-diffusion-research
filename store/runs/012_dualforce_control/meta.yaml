notes: >
  Architecturally identical to ctt_v2/ctt_v3 (verified: checkpoint carries 960 plain LoRA tensors, rank 128,
  attn_ffn, no operator_encoder/bottleneck/context_adapter tensors) — so generation uses the proven one_way IC-LoRA
  inference stack (eval_ladder/run_gen.py with the src/LTX-2-ctt-v2-train packages on PYTHONPATH, --rank 128
  --alpha 128, attention one_way), exactly as ctt_v3 was generated. run_gen.py defaults --rank to 32; pass
  --rank 128 --alpha 128 explicitly or the adapter loads mismatched.
