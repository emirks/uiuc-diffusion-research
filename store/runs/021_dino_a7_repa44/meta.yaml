source: >
  Campaign 2026-08-27_dino_signal_training — arm A7_repa44, the TRANSPORT-REPA arm. A7 = A0_baseline recipe
  (dataset 005_ctt_v2plus_s6reshape, owner mix, seed 42, rank 128, lr 1e-4, batch 1 × accum 4, 2×GH200,
  reference.probability 1.0, WSD warmup 100 / decay_frac 0.25) with exactly: steps 6000 + an auxiliary
  transport-REPA loss. `signal.enabled: false` — NOTHING is injected (the injection forward is bitwise A0);
  A7 changes the OBJECTIVE, not the input. Every step the VIDEO hidden after transformer block 16 (output),
  at the generated target tokens only, is passed through a small head (LayerNorm(4096) -> Linear(4096,1024)
  -> SiLU -> Linear(1024,44) zero-init) and regressed onto the TARGET clip's OWN 44-ch NORM-v4 z-scored DINO
  transition program (group-balanced MSE over the 5 channel groups). total = fm_loss + 0.25·aux + Σ probe;
  λ=0.25 constant, all σ uniform. Detached depth probes at blocks 8/24/32 (telemetry only). A reference probe
  (matched/deranged/nodemo, 8 pinned rows × σ∈{0.2,0.5,0.8}) runs every 500 steps. INFERENCE IS UNCHANGED:
  the aux head is train-only. Registered at the FINAL step-6000 checkpoint (target reached; no earlier ship).
  Implementation record: misc/2026-08-27_dino_signal_training/A7_IMPL.md; pre-registration A7_PREREG.md.
