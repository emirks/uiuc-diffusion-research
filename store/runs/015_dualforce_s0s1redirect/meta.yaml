  Architecturally identical to ctt_v2/012/013/014 (plain r128 attn_ffn LoRA, one_way, no operator_encoder/
  bottleneck) — generation uses the proven one_way IC-LoRA inference stack (eval_ladder/run_gen.py with the
  src/LTX-2-ctt-v2-train packages on PYTHONPATH, --rank 128 --alpha 128, attention one_way). Control = 012@1000.
