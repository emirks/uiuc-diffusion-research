# ---------------------------------------------------------------------------- the intervention
intervention: >
  The ONLY content delta versus runs/002 is the reference channel: the raw full-resolution demo
  latents are REPLACED (not augmented) by 72 operator tokens, shape (6,4,3)x128, emitted by the
  certified transition encoder held FROZEN. skip_scale pinned 0.0 so no raw pooled demo can leak in.
frozen_encoder:
  params: 8,606,336 (50 tensors)
  source_sha256_of_module: fd25835e...   # misc/bneck_v2/operator_encoder.AS_CERTIFIED.py, ported byte-identically
  verified: >
    G2 at step 10000 — all 50 encoder tensors in the final checkpoint are EXACTLY the bf16 cast of
    the certified weights. The encoder provably did not move across 10,000 DDP steps.
input_contract: >
  The certified artifact is weights + featurization, so both are ported (bneck_contract.py, read by
  trainer AND generator): per-clip per-channel standardization (ddof=0) -> fp32 forward with autocast
  DISABLED -> prefix/suffix fixed at (2,1) for every clip -> S2 frame_keep_mask at train time,
  maskless at generation. G1 verified this on BOTH architectures (aarch64 GH200 and x86 H100):
  max |delta| 2.6e-6 - 9.3e-6 against a 1e-3 x code-RMS bar, with all three must-fail calibrators
  rejected on both (old encoder source; standardization omitted; bf16 autocast on).

# ---------------------------------------------------------------------------- caveats (pre-registered)
# Recorded BEFORE any coupled result existed. Full text: misc/bneck_coupling/advisors/A9_*.md
caveats:
  C1_realized_lr_schedule: >
    The written schedule (LinearLR 1e-4 -> 1e-5 over 10,000 steps) was NOT the realized schedule in
    either run: Accelerate's AcceleratedScheduler steps once per rank, so decay completes in
    10000/num_ranks steps. Measured from each run's own log, both match
    LR = 1e-4 x (1 - 0.9 x ranks x step / 10000) exactly: runs/002 (8 ranks) floored at ~step 1,250
    (~87.5% of the run at 1e-5); this run (4 ranks) floored at ~2,506 (~75%), i.e. roughly TWICE the
    incumbent's high-LR exposure. The defect is inherited, not introduced. Consequently this run
    supports NO matched-training-budget or channel-efficiency claim relative to runs/002.
  C2_s4_positional_factors: >
    No positional factorization of the frozen (6,4,3) geometry is valid for both CTT-v2 latent grids
    (exhaustively verified: only 8 shapes work on both, all f=2 with >=308 tokens). So S4-shaped
    references (13% of the mix, grid (5,14,26)) use operator-pinned RoPE factors (3,1) via a
    per-sample fallback, while 121-frame references keep the incumbent-validated INFERRED (5,3).
    Verified on arithmetic, not on a log count: the 121f grid never enters the fallback branch.
    The evaluation grid is 100% 121-frame, so the pinned geometry affects training signal only.
health:
  exceptions: 0
  checkpoints: 40 (every 250 steps), all mirrored to durable storage
  final_loss_line: "Step 10000/10000 - Loss: 0.4740, LR: 1.00e-05"
  inline_validation: 77 videos, routed THROUGH the bottleneck (the trainer previously never attached
    the encoder to its validation runner — fixed before this run; see DOSSIER)
notes: >
  run_gen.py defaults --rank to 32 — pass --rank 128 --alpha 128 explicitly.
  This checkpoint carries 50 operator_encoder.* tensors alongside 960 LoRA tensors; run_gen REFUSES
  to generate a bottleneck arm from a checkpoint lacking them (the provenance guard).
  The same file serves BOTH gens/008 (matched) and gens/009 (shuffled-code corpse) — the corpse is a
  generation-only arm and is never trained.
