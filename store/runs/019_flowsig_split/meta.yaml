recipe_variant: textdrop-coupled
recipe_defect: 'RECIPE DEFECT (pre-registration deviation, discovered 2026-08-25 pre-registration): the
  text-dropout draw and the conditioning-cell draw consumed the identical first uniform from same-seeded
  per-step generators, making them rank-coupled. Realized joint (S0/S1 strata): text absent on 100% of
  `both` rows; text present on 100% of `code_only`, `none`, and `ref_only` rows. Marginal text-drop rate
  was on target (0.506 / 0.512), so the defect is invisible to marginal checks -- only the joint reveals
  it. Consequence: the model never saw the `code_only x text-absent` configuration -- the program was
  never the sole operator description in context at any training step. The pre-registered independent-50%-dropout
  recipe was NOT run. Registered as recipe variant `textdrop-coupled`. Contrast D is empty by construction
  in training telemetry.'
