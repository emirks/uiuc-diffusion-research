arm_mechanics:
  program_tokens: 1280
  pooling: 2x spatial -> K16 x 10 x 8 (ceil on the odd width 15)
  layout: '[program | ref | target]; one-way read-only split point at P+M'
  positions: the corresponding target-region (t,y,x) block centres, NO time offset (min of block starts,
    max of block ends -> RoPE midpoint is the block centre)
  null_program: 'ALL-NULL TOKENS, not token absence -- the tokens are attached on EVERY step and carry
    the learned null through an arithmetic blend feats = present*feats + (1-present)*null. This is a mid-run
    change forced by a DDP failure (program.token_head.4.weight was marked ready twice because a structurally-zero
    ''touch'' term used it outside the checkpointed blocks); the advisor ruled it and it also restores
    the owner''s original ''learned null tokens'' spec. Consequence: signal-CFG''s unconditional branch
    is ''all-null tokens'', which is exactly what the model saw in training.'
  failed_attempts_before_the_fix: jobs 3021289/90/91 died at step 1 (~0.4 GPU-h)
