known_limitations:
- EffectData rows were NOT built (owner fallback clause invoked); the in-house counterfactual pressure
  comes from S1's 126 contents with >=2 operators.
- S2a+S2b (25% of the mix) carry NO cached program and trained as permanently program-null anchor mass;
  program-present steps are ~56% of all steps.
- Inline validation is program-free (see training_result.validation).
- Effective batch 2 (2 GPU x bs1 x accum1) vs 002's 8 -- forced by the GPU-hour budget.
- The D-probe's content is in-sample; only its CONFIGURATION is out of distribution.
