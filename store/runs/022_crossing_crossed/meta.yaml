source: >
  Campaign 2026-09-13_crossing_ablation — arm CROSSED, the "all but one" crossed layout. From-scratch IC-LoRA
  on LTX-2 19B dev. Crossed = every shot is trained under all operators of its block BUT ONE (the shot says
  nothing about the operator; only the reference names it). 21 operators = 9 S1 manners (one-sided) + 12 S2
  shaders (two-sided). 1,392 pairs. Paired with the UNCROSSED arm (runs/023), which is identical in every
  setting and differs ONLY in data layout (each shot under exactly one operator). The T1/T2 readout of the two
  arms is the experiment; see gens/034_crossing_crossed/01_t1t2__eps and the campaign HANDOFF.md §1.
  This run is the healthy member of the pair. Owner terms: shots, operators, pairs, references, crossed/uncrossed.
inputs:
  dataset: datasets/008_crossing_allbutone     # 1,392 pairs (crossed layout: 39 shots x (K-1) operators + S2); root self-contained
trainer:
  checkout: src/LTX-2-surg
  commit: a403323            # eps copy has no .git; content-verified identical (171/171 tracked files of packages/{ltx-trainer,ltx-core,ltx-pipelines}/src) per HANDOFF §2
  entry: accelerate launch --num_processes 2 (DDP, 2 GPUs) via misc/2026-09-13_crossing_ablation/eps/{launch_lane2.sh, run_arm2.sh}; config.yaml (the eps crossed_2gpu.yaml) copied here; training_config.yaml is the trainer-written record
recipe: LTX-2 19B dev; IC-LoRA rank 128 / alpha 128 on attn1+attn2+FF (10 modules, target_modules attn_ffn); one_way reference attention + mask, cond_clean latents; lr 2e-4; batch 1/GPU x 2 GPU (eff-batch 2, no accumulation); WSD (warmup 100 / decay_frac 0.25 / end 0.1); grad checkpointing; bf16; uniform pair sampler seed 42; checkpoint every 250 (all kept); validation every 500 incl. step 0 (validation NOT representative — see health)
