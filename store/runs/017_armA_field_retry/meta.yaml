model: LTX-2 19B dev (frozen)
adapter: >
  IC-LoRA r128/α128 one-way reference attention (RAW video reference latents concatenated as tokens — no
  bottleneck) + a trainable semantic-flow FieldInjector (additive, gated, 6 sites). target_modules attn_ffn
  (10): attn1/attn2 {to_k,to_q,to_v,to_out.0} + ff.net.0.proj + ff.net.2. FieldInjector params
  (field_injector.gates + mlp + norm_mean/std) live IN the shipped safetensors.
rank: 128
alpha: 128
dropout: 0.0
reference_attention: one_way
lr: 1e-4, WSD schedule (scheduler_type: wsd, warmup 150 / decay_frac 0.25 / end_factor 0.1), 4000-step config
timesteps: shifted_logit_normal
seed: 42
effective_batch: 4                     # batch_size 1 × grad_accum 2 × 2 GPU
steps_config: 4000
shipped_step: 4000
checkpoints:
  lora_weights_step_04000.safetensors:
    sha256: 8853040b833e6c6f2a8ec0869afbe2be68536c319f5874e4256e295ea162ee02
    step: 4000
    note: shipped/final; the FieldInjector weights are included in this file
field:
  enabled: true
  demo_dropout: 0.5                    # 🔑 the retry lever (v1 = 0.0, which atrophied)
  field_dropout: 0.15                  # null-field draw (enables field-CFG later)
  gate_init: 0.05                      # RMS-scaled (fraction of local hidden RMS)
  sites: 6
  mlp_hidden: 256
  channels: 18
  scale_by_hidden_rms: true
  gate_final_abs: 0.0075               # plateaued (signed 0.0031); v1 died to 0.0016
result:
  verdict: REFINED NEGATIVE            # advisor-adjudicated on a pre-committed closure table (Row 3)
  positive: demo-dropout rescues a real seed-stable dose-stable nulled field-swap (10→10→12/13, +0.11) — first robust sampling-time effect from a TRAINED channel this campaign
  negative: >
    NOT per-token instruction — spatial-shuffle 13/13 ≈ full (zero attenuation) + geometry at chance ⇒ no per-token
    spatial program; temporal-shuffle 13/13 with a sub-threshold 43% magnitude cut (0.107→0.0615, misses the ≥0.05
    degrade bar by 0.004, sign structure intact) ⇒ the rescued signal is PREDOMINANTLY a scalar field-presence
    MAGNITUDE readout with at most a weak temporal-envelope component (refines the earlier "global clock" wording).
    Either way redundant with Arm C's free test-time clock steering.
  evidence: misc/2026-08-21_semantic_flow_run/build/fieldswap_{score_,}v2ck4000_{nulled,present,shuffled,tshuffled}.json ; gate curve via build/gate_trend.py
  finding: misc/2026-08-21_semantic_flow_run/PROPOSED_F_BLOCK.md (owner-gated — awaiting approval before docs/FINDINGS.md)
  instrument_note: the gate-magnitude liveness bar (raw gate ≥0.025) is RETIRED — a 0.0075-abs gate produced a +0.107 seed-stable phase swap
