machine: dai — NCSA DeltaAI GH200 (aarch64), ghx4, bhwp-dtai-gh; 2 GPU × grad_accum 2 (effective batch 4)
source: >
  Campaign 2026-08-21_semantic_flow_run — Arm A FLAGSHIP: a semantic-flow FIELD-conditioned IC-LoRA (v2,
  "demo-dropout retry"). ctt_v2 (runs/002@10000) recipe warm-started, PLUS an auxiliary precomputed
  "semantic-flow field" (per-reference (16,20,15,18) fp16: 8 logistic retiming PHASES + 8 temporal
  derivatives + confidence + detour, extracted endpoint-relative from the DEMO via DINOv2) injected
  ADDITIVELY through a gated per-channel-normed MLP (18→256→4096) at 6 evenly-spaced blocks on the
  generated-middle tokens only (gate init 0.05, RMS-scaled = fraction of local hidden RMS, bf16-safe).
  The ONE change vs the v1 field arm (which atrophied): demo_dropout=0.5 — on ~50% of steps the in-context
  demo latents are replaced by a layout-preserving noised null, so the FM loss MUST route the operator
  through the field (escapes the conditional-redundancy gate-atrophy that killed v1). Anti-endpoint-shortcut
  twin data mix (~40% S2a+S2b same-endpoint×different-operator gl-transitions + ~60% ctt_v2 diet).
  RESULT = REFINED NEGATIVE (advisor-adjudicated, pre-committed closure table): demo-dropout RESCUED a real,
  seed-stable, dose-stable demo-NULLED field-swap (toward_B_phase 10/13→10/13→12/13 across ck2000/3000/4000,
  mean_swap_phase +0.121/+0.105/+0.107, p≈0.002 @4k; gate collapse arrested at a plateau ~0.0075 abs vs
  v1's death to 0.0016) — BUT the transfer is SHUFFLE-INVARIANT (spatial-shuffle control 13/13, +0.113,
  gap −0.006) and the per-token geometry channel is at chance (5/5/6 of 13) → the field carries the
  operator's GLOBAL TEMPORAL CLOCK, no per-token spatial program; redundant with Arm C's free test-time
  clock steering. Copy-guard clean (near_copy 0/13). KEPT as a negative-result artifact / paper mechanism.
