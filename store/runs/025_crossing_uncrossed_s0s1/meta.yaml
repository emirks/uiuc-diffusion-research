source: >
  Campaign 2026-09-13_crossing_ablation — CLEAN S0+S1 RETRAIN, arm UNCROSSED. From-scratch IC-LoRA on LTX-2 19B
  dev. Uncrossed = every shot is trained under exactly one operator (the shot alone names the operator; the
  reference is redundant). This is the clean re-run of runs/023, whose uncrossed arm DIVERGED at step 1392 at lr
