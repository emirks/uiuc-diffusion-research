  S0+S1 block ONLY (sided=="one"): 864 pairs, 9 S1 spec-render manners. This arm trained CLEAN (no divergence).
  Identical in every setting to runs/024 (CROSSED) except data layout. The T1/T2/T0 readout of the two arms is
  the experiment; RETRAIN_S0S1.md has the rationale + pre-registered bars. Owner terms: shots, operators, pairs,
  references, crossed/uncrossed.
