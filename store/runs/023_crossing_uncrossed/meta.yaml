source: >
  Campaign 2026-09-13_crossing_ablation — arm UNCROSSED, the "all but one" uncrossed layout. From-scratch
  IC-LoRA on LTX-2 19B dev. Uncrossed = every shot is trained under EXACTLY ONE operator (the shot alone names
  the operator; the reference is redundant). 21 operators = 9 S1 manners (one-sided) + 12 S2 shaders
  (two-sided). 1,392 pairs. Identical in every setting to the CROSSED arm (runs/022); the ONLY difference is
  the data layout. The T1/T2 readout of the two arms is the experiment; see
  gens/035_crossing_uncrossed/01_t1t2__eps and HANDOFF.md §1. Owner terms: shots, operators, pairs,
  references, crossed/uncrossed. This run DIVERGED at step 1392 (see health); the owner decided to test it as
  trained.
