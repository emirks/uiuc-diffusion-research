source: >
  Campaign 2026-09-13_crossing_ablation — CLEAN S0+S1 RETRAIN, arm CROSSED. From-scratch IC-LoRA on LTX-2 19B
  dev. Crossed = every shot is trained under all operators of its block BUT ONE (the shot says nothing about the
  operator; only the reference names it). This is the clean re-run of the pair (runs/022 crossed + runs/023
  uncrossed): the first pair's UNCROSSED arm DIVERGED at step 1392 at lr 2e-4, confounding the comparison, and it
  was trained on the full 1,392-pair set (S1+S2). This retrain removes both variables — lr lowered to 1e-4 (proven
  stable r128 point) and the data restricted to the S0+S1 block ONLY (sided=="one"): 864 pairs, the 9 S1 spec-render
  manners. Paired with runs/025 (UNCROSSED), identical in every setting, differing ONLY in data layout (each shot
  under exactly one operator). Reason for the retrain + pre-registered bars: RETRAIN_S0S1.md. Owner terms: shots,
  operators, pairs, references, crossed/uncrossed.
