  dataset: datasets/008_crossing_allbutone     # S0+S1 block ONLY (sided=="one"): 864 pairs, 9 S1 operators, 27 crossed shots x 8 operators x 4 refs; sample_list crossed/samples_s0s1.jsonl (filtered from samples.jsonl; equal-cell-exposure verified 96 pairs/operator both arms)
