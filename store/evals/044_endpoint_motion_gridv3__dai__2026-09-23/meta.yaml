namespace: raft_flow_win@r256
move_px: 0.5
definition:
  - "F_given = raft_flow_win@r256 of the given clip: start9 -> flow_start (frames 0..8, 8 steps); end9 -> flow_end (frames 1..8, 7 steps)."
  - "F_out = raft_flow_win@r256 of the output: flow_start (frames 0..8) for side A; flow_end (last 8 frames) for side B (two-sided rows only)."
  - "If the given clip and the output decode to different HxW, F_given is resized to the output's HxW and its vectors scaled accordingly."
  - "M = per-step pixels where max(|F_out|, |F_given|) >= 0.5 px. agree = 1 - sum_M |F_out - F_given| / sum_M (|F_out| + |F_given|); epe = mean_M |F_out - F_given| px; cos = |F_out||F_given|-weighted cosine over M."
  - "NaN (with given_moving_frac) when the given window has no moving pixel. Only HF-121f rows (9-frame clip given) are scored."
  - "Not measurable (row field not_measurable, no A_/B_ values) when the given window of that side is a single frame: store_eval_common.windows(gtype, sided) n_pre < 2 (side A) / n_suf < 2 (side B) \u2014 the ED rows and the frame-conditioned externals (refVFX, Wan FLF2V), even when a raft_flow_win feature exists for the gen (2026-09-23)."
  - "TEG baseline with CLIP endpoints (VACE16, 2026-09-20): the given clips are the 16-fps resamples conds_16fps/<endpoint>_start6 (5 steps) / _end4 (3 steps); side A compares the first 5 steps, side B the LAST 3 steps of the output's pinned end window (both windows aligned at the seam they share with the given clip)."
why: "Endpoint identity (DINO) shows the given frames are kept; this is the motion counterpart: the given clip's motion must be reproduced inside the pinned window. Dense per-step flow is the aligned-video standard (flow end-point error); the earlier track-based probe compared one net displacement over 400 grid points and was jitter-limited."
caveat: "Whole-frame motion (subject + background + camera), no subject mask yet; flow at 256 px short side; the output window is pinned by conditioning so values near 1 are expected for every arm (a conditioning check, not a ranking)."
