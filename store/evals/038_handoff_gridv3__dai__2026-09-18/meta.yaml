id: 038_handoff_gridv3__dai__2026-09-18
seq: 38
shelf: evals
created: '2026-09-18'
machine: dai (login CPU, numpy over stored features)
instrument: scripts/handoff_metrics.py @ fbf9e00
definitions_version: v2 (2026-09-18)
definitions_reason: "v2 redefines motion_A/motion_B as hand-off velocity continuity from the gen's own cotracker3 tracks. v1 used motion_fidelity against the 9-frame condition clip, which returned NaN on most rows because a 9-frame clip has almost no tracklets above its moving threshold (motion_A defined ~165/564 HF, motion_B ~22/148, though gen and condition tracks are 100% present). The v1 values are retained as motion_A_mf / motion_B_mf. identity_A/B and seam_free are unchanged."
definitions:
  - "Conditioning windows: HF-grid rows (121 f): n_pre = 9, n_suf = 8 if sided == \"two\" else 0. ED-grid rows (81 f, frame-0 anchor): n_pre = 1, n_suf = 0. Externals (VAP/VFXMaster 49 f, refVFX 33 f, frame-0 conditioning): n_pre = 1, n_suf = 0. TEG baselines (2026-09-20, two-sided rows): frame-conditioned externals (refVFX two-sided, Wan FLF2V; frame 0 of start9 / frame 8 of end9 given) n_pre = 1, n_suf = 1; the VACE first-last CLIP baseline (grid type VACE16, 16 fps) n_pre = 6, n_suf = 4 against the resampled given clips misc/2026-09-20_teg_baselines/conds_16fps/<endpoint>_{start6,end4}.mp4 (store_eval_common.cond_clips)."
  - "Hand-off window length K = max(2, round(fps / 3)) frames (~1/3 s; 8 at 24 fps, 3 at 9.72 fps, 5 at 15 fps). fps via probe_fps(gen_video)."
  - "identity_A = mean over t in [n_pre, n_pre+K) of cos(f_gen[t], f_condA[n_pre-1]) where f_condA = dino of <endpoint>_start9.mp4 (the last GIVEN frame; for n_pre=1 that is frame 0). identity_B (two-sided only) = mean over t in [T-n_suf-K, T-n_suf) of cos(f_gen[t], f_condB[T_B - n_suf]) where f_condB = dino of <endpoint>_end9.mp4 and T_B = 9 (the first given suffix frame = frame 1 of end9). Else NaN."
  - "motion_A / motion_B = hand-off VELOCITY CONTINUITY from the GENERATION's own cotracker3 tracks (no condition tracks needed; the given frames inside the gen ARE the condition clip's frames, pinned). Per tracklet j visible on every frame of both windows: v_before_j = mean velocity over the last 3 given steps (frames [n_pre-3, n_pre]), v_after_j = mean velocity over the first K generated steps (frames [n_pre, n_pre+K]); cos_j = cosine(v_before_j, v_after_j); weight w_j = |v_before_j|*|v_after_j|. motion_A = sum_j w_j cos_j / sum_j w_j; NaN if sum_j w_j < 1e-6 (nothing moves) or n_pre < 4 (frame-anchored rows: ED grids and all externals -> NaN by construction). motion_B symmetric at the suffix (two-sided rows only): v_before = mean over the last K generated steps before the suffix (frames [T-n_suf-K, T-n_suf]), v_after = mean over the first 3 given suffix steps (frames [T-n_suf, T-n_suf+3]). Velocities in pixels of the tracked resolution (the ratio is scale-free); visibility (vis >= 0.5) required on every frame of both windows."
  - "motion_A_mf / motion_B_mf (reference columns) = the previous definition: motion_fidelity of the gen's tracks sliced to [0, n_pre+K) (n_pre >= 9) / [T-n_suf-K, T) (two-sided) against the condition clip's full tracks. Kept for reference; low definedness because a 9-frame condition clip has almost no tracklets above its moving threshold (the reason for the v2 redefinition)."
  - "seam_free = 1 if the relevant seam z-scores <= 3 (prefix only for one-sided; prefix and suffix for two-sided) \u2014 read prefix_seam_z, suffix_seam_z from the v4 rows (evals 028|030), from Op-2's per_gen.jsonl if present else items.jsonl."
  - "Missing feature (e.g. externals before their extraction lands) -> NaN + a `missing` entry naming the namespace/role; never crash; idempotent per gen."
