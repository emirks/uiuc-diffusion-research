  transition, adding DCG at w=1.5 changes appearance %same by ~0 (96.0->96.0 excl-refctl; 90.4->90.3
  incl-refctl; paired per-item median +0.28pp), with demo-copy CLEAN (Δmean +0.014, Δmax +0.013, exceed 6%)
  and all harm rails clear. Additivity lens formally VOID at this ceiling (w1=96.0 >= 95). Headroom-share 0%
  (<7% band) => the effect text largely SUBSTITUTES for demo guidance (neutral was 20%). w3/w6 demo-copy
  max-of-max FAILS (intrusion replicates) but ~3x flatter than neutral (hypothesis-grade). Cross-phase: DCG@
  w1.5 is a substitute for missing text, not a complement — gate ON for neutral/underspecified prompts
  (neutral +3.3pp), OFF when text already specifies the effect. Full analysis: DOSSIER.md R7-R10.
