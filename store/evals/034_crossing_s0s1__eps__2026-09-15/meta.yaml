  crossing_uncrossed_s0s1: {gen: gens/039_crossing_uncrossed_s0s1/01_t0t1t2__eps, run: runs/025_crossing_uncrossed_s0s1, rows: 11664}   # t0 3888 + t1 3888 + t2 3888; error_rows 0
