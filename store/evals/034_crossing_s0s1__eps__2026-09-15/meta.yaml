headline:   # ceiling-normalised % (and shares); levels only, no verdict. n = 54 item x seed per arm.
  T0_top1_designated_share: {crossed: 0.167, uncrossed: 0.185, base: 0.130}   # chance 0.111; adapter-base crossed +0.037, uncrossed +0.055
  T0_d_designated_pct:      {crossed: 56.72, uncrossed: 57.54, base: 54.01}
  T1_pct_same:              {crossed: 90.14, uncrossed: 86.63, base: 92.97}   # |crossed-uncrossed gap| = 3.51 pp (equal-training bar <=5 pp: MET)
  T2_d_designated_pct:      {crossed: 63.49, uncrossed: 57.66, base: 75.81}   # %like-shot
  T2_d_missing_pct:         {crossed: 86.92, uncrossed: 81.06, base: 92.88}   # %like-reference
  T2_margin_pct:            {crossed: 23.42, uncrossed: 23.40, base: 17.07}   # d_missing - d_designated; adapter-base +6.35 / +6.33
  paired_T2_d_designated_uncrossed_minus_crossed_pp: -5.83   # mechanism direction: WRONG sign (crossed pulls to the shot's own operator MORE than uncrossed)
bars:   # RETRAIN_S0S1.md pre-registered
  real_mechanism: NOT MET — T2 uncrossed %_designated - crossed = -5.83 pp (needs >= +5 pp, sign share 0.333 < 0.62); T0 uncrossed top-1=designated 0.185 (needs >= 0.40 and >= 2x crossed 0.167)
  modest_fidelity: MET — T2 margin +~6.3 pp over base on both arms; d_designated spread 18.2 pp (base highest), shot-pull flat/wrong-sign
  equal_training_T1: MET — |gap| 3.51 pp <= 5 pp (the first pair's larger T1 gap tracked the divergence, not the data layout)
caveats:
  - Scored on eps, NOT DeltaAI. All 3 arms + all 3 cells used the SAME eps reference_v4 (e6ea4011…) -> cross-machine ±<=0.005 on ABSOLUTE levels vs the DAI instrument; every CONTRAST (adapter-base, crossed-uncrossed, T2 margin, T1 gap) is common-mode-safe (the reference population cancels).
  - Lean feats-only scorer: app_ref + copy_max only (the v4 headline + copy guard); no CoTracker/LPIPS/structure-heavy fields. Bit-exact to the full harness for those two fields (val/val2).
  - Single training seed per arm (seed 42); generation seeds 42/43. 9 S1 manner operators only (s0+s1 block); no s2 block, no T3 in this pass.
  - references in T1/T2 rows (S1 renders) are outside the certified 222 population; the reference-corpus stays the 222 pin.
  - item_ids are arm-prefixed (<arm>__<gen_item>__pool_<manner>__s<seed>__ref_<poolclip>); joins key on (arm, item_id) per the v4 contract.
