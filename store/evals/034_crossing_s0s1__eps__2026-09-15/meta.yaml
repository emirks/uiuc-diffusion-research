source: >
  Crossing ablation (CTT paper) — CLEAN s0+s1-only retrain. Three arms scored on ONE machine (eps):
  crossing_crossed_s0s1 (runs/024), crossing_uncrossed_s0s1 (runs/025), and base_oneway (adapter=None
  zero-point). Removes the first pair's divergence confound (runs/023 diverged at step 1392) by dropping
  lr to 1e-4, WSD, 3000 steps, and restricting data to the S0+S1 one-sided block (9 dense S1 manner
  operators, 27 crossed shots). Three test cells per shot, seeds 42/43, generated on eps (xab_gen.py,
  one_way, prefix 9, 480x640x121):
  T0 (SHOT-ONLY, no reference) — the direct shortcut probe: does the arm emit the shot's TRAINED
  (designated) operator from the shot alone? chance for any operator = 1/9.
  T1 (reference = the shot's DESIGNATED operator on another shot) — equal-training %_same check.
  T2 (reference = a MISSING/swap operator, never trained on this shot in either arm) — margin
  = %like-reference (d_missing) - %like-shot (d_designated).
  9-POOL scoring: each gen scored against ALL 9 S1 manner pools -> per (arm,shot,seed) top-1 in
  {designated, missing, other} and a %ceil per pool. Owner terms: shots, operators, references,
  crossed/uncrossed.
