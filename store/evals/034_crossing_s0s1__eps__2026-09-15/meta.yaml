labels: per arm, one label dir per cell (t0/t1/t2), each with items.jsonl + results.json (3888 rows/arm/cell). Aggregators: eval_s0s1/analyze_t{0,1,2}_9pool.py -> summary_t{0,1,2}_9pool.json + per_item/per_pool CSVs.
