storage:
  layout_deviation: >
    Each arm dir here is a relative SYMLINK to misc/2026-08-06_metric_eval/gen_eval/scores_v4lane/<arm>
    (the campaign-private v4-lane score tree) rather than a copied <arm>/<shard>/{items.jsonl,results.json}
    tree (siblings evals/001-002 copy). Owner directive 2026-08-07: score into a campaign-private tree,
    wire into the store by symlink — the store contract's "wiring, not copying". Unlike evals/004 the
    full scorer output IS present (each shard's items.jsonl AND results.json), so no provenance is lost;
    the symlink is purely a no-duplicate wiring choice. Relative targets (../../../) resolve on both clusters.
pool_rule: >-
  run_eval.pool_refs() semantics (build_eval_manifest_v4lane.py, verbatim from misc/base_arms/eval):
  the same-class GT pool for the row's gt_pool_class, copy-guarded by removing the row's own `reference`
  and `endpoint`, first 8 by clip name. Asserted row-by-row IDENTICAL across the three arms against the
  ic_gen_effect registry (measured 0/152 mismatches) — which is why the neutral base rows keep a
  `reference` they were never shown (`use_reference: false`). ic_gen_effect's manifests were reused from
  the campaign's ladder plan and independently VERIFIED: 1842 items / 304 gens / 152 rows, every
  reference_video in the 222-clip corpus, pool identity 0/152, all generations present, and per-shard
  disjoint by generated_video (no cache write race possible).
caveats:
  - >-
    ONE MACHINE. Scored on DeltaAI GH200, the same box and identical instrument sha as evals/001
    (five-arm) and evals/002 (base arms), so the levels are readable next to those. eps and DeltaAI do
    not reproduce each other row-by-row on this instrument (max |Δ| 0.185 on app_ref, 54% of rows
    breaching the 0.005 bar), so never mix a row from the two.
  - >-
    item_ids COLLIDE across the three arms here (all ran the ladder2 CTT grid — byte-identical item_id
    sets, measured), though they do NOT collide with eval_ladder/registry.jsonl (0/152). The harness
    `arm` stamp is the only field separating them — key on (arm, item_id), and never add two of these
    directories to one score set's `paths`.
  - >-
    ic_gen_effect is a TREATMENT (it reads the reference; ref_novelty=seen), not a baseline. Its
    manifest carries the ladder plan's `twin_of` to the effect-free ic_gen base twins, but those base
    twins are NOT scored in this entry, so the twin_of references DANGLE here. This entry reports LEVELS
    only; any paired Δpp for ic_gen_effect must be computed elsewhere against a scored base twin.
  - >-
    The two neutral arms are UN-TWINNED (`no_twin: true`): they ARE the baselines, contributing a LEVEL,
    never a paired margin.
  - >-
    The neutral arms use a V-NEUTRAL prompt (start scene only; both `sksz` and the effect clause removed)
    — they are the specificity-ZERO anchor and the caption V-neutral probe. They are NOT interchangeable
    with evals/002's base_prompt_ctt / base_cond_ctt, whose prompts STATE the effect. ic_gen_effect's
    prompt convention matches gens/005_ctt_v2_leaky's (effect clause after the `sksz` token).
