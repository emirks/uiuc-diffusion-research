source: >
  Crossing ablation (CTT paper). Two from-scratch IC-LoRA arms (LTX-2 19B dev, r128/alpha128 one_way,
  dataset 008_crossing_allbutone) trained on eps: CROSSED = the "all but one" layout (each shot trained
  under all-but-one operator; the reference names the operator) vs UNCROSSED = each shot under exactly
  one operator. Two blocks: s0s1 (one-sided, 9 dense S1 manner operators, 27 shots) and s2 (two-sided,
  12 gl-transitions shader operators on existing S2 endpoint pairs, 12 endpoints). Per shot the T1 and
  T2 test clips were generated on eps (seeds 42/43) and scored here on ONE machine (DeltaAI).
  T1 ("seen"): shot + reference of its DESIGNATED operator (trained on this shot in both arms) -> tie
  check on %_same toward that operator's class. T2 ("swap"): shot + reference of the MISSING operator
  (never trained on this shot in either arm; the missing cell is reached only through the reference) ->
  margin = %_missing - %_designated: does the output follow the reference (missing) operator or the
  shot's designated operator? Each T2 item is scored TWICE against two same-clip pools (one video_key,
  two rows t2_role=missing|designated, distinct gt_pool_class).
