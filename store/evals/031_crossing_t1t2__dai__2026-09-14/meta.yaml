caveats:
  - uncrossed arm (runs/023) DIVERGED at training step 1392 and was tested as trained (owner decision); its T1/T2 numbers are of a diverged adapter.
  - the 12 S2 shader classes are NOT eval classes anywhere; their SCORING pools are 30 EXISTING S2 shader renders each (inventory-authoritative clip->shader; stratum-qualified; excludes every T1/T2 target/reference and every crossing-training S2 target/reference stem, misc/.../eval/s2_pools.json = 360 clips) and their ceilings are NEW (corpus-against-itself over a 12-clip subset), not the certified matrix. S2 pools are two-sided renders scored whole-clip while the two-sided gens carry a suffix mask (documented masking asymmetry).
  - references in our rows (S1/S2 renders) are OUTSIDE the certified 222 population -> reference-corpus kept at the 222 pin (--reference-corpus, amendment 2); rows carry ref_in_v4_population=false and get r_ref against the 222 population.
  - single training seed per arm (seed 42); generation seeds 42/43. No T3 (grid-v3 zero-shot) in this pass.
  - the inline-validation attention omission (bidirectional vs one_way; HANDOFF §6) does NOT affect these gens -> T1/T2 were generated via the one_way run_gen path.
  - item_ids embed the harness_arm so they are distinct across arms here, but every join keys on (arm, item_id) per the v4 contract (item_ids can collide across arms in general).
