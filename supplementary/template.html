  <script>

(function(){
  const containers = document.querySelectorAll('.prompt-wrap .container');
  containers.forEach(container => {
    let isDragging = true;
    const slider = container.querySelector('.slider');
    const media2 = container.querySelector('#media2');
    container.addEventListener('mousedown', () => { isDragging = true; });
    container.addEventListener('mouseup', () => { isDragging = true; });
    container.addEventListener('mousemove', (event) => {
      if (!isDragging) return;
      const {clientX} = event;
      const {left, width} = container.getBoundingClientRect();
      let percentage = (clientX - left) / width * 100;
      percentage = Math.max(0, Math.min(100, percentage));
      media2.style.clipPath = `inset(0 ${100 - percentage}% 0 0)`;
      container.style.setProperty('--cut', `${100 - percentage}%`);
      slider.style.left = `${percentage}%`;
      container.style.setProperty('--cut', `${100 - percentage}%`);

    });
    slider.style.left = '40%';
    container.style.setProperty('--cut', '40%'); 
  });
})();

  <script>


    
    (function(){
      function transformSection(sectionTitleEl){
        const header = sectionTitleEl.closest('.subsection-header');
        if (!header) return;
    

        let node = header.nextElementSibling;
        const items = [];
        while (node && !node.classList.contains('subsection-header')) {
          if (node.classList && node.classList.contains('media-item')) items.push(node);
          node = node.nextElementSibling;
        }
    

        items.forEach(item => {
          const container = item.querySelector('.image-container');
          if (!container) return;
    

          const vSources = item.querySelectorAll('video source');
          if (vSources.length < 2) return;
          const oursSrc = vSources[0].getAttribute('src');
          const refSrc  = vSources[1].getAttribute('src');
    

          const overlay = document.createElement('div');
          overlay.className = 'image-container overlay-frame';
          overlay.innerHTML = `
            <video class="gen-video fill-video" autoplay muted loop playsinline>
              <source src="${oursSrc}" type="video/mp4"/>
            </video>
            <div class="ref-thumb-wrap" title="Hover to hide the reference video">
              <video class="ref-thumb" autoplay muted loop playsinline>
                <source src="${refSrc}" type="video/mp4"/>
              </video>
              <div class="corner-badge ref">Reference</div>
            </div>
            <div class="corner-badge gen">Generation</div>
          `;
    

          const old = container.querySelector('.prompt-wrap') || container.firstElementChild;
          if (old) {
            container.replaceChild(overlay, old);
          } else {
            container.innerHTML = overlay.outerHTML;
          }
          item.classList.add('overlay-card');
        });
      }
    
      document.addEventListener('DOMContentLoaded', () => {

        document.querySelectorAll('.subsection-title.dvsi-enabled').forEach(transformSection);
    

        function tryPlayAll(scope){
          scope.querySelectorAll('.overlay-card video').forEach(v => {
            v.muted = true;
            const p = v.play();
            if (p && typeof p.catch === 'function') { p.catch(()=>{}); }
          });
        }
        tryPlayAll(document);
        window.addEventListener('click', () => tryPlayAll(document), { once: true });
      });
    })();
    </script>

  <script>
    (function(){
      const inView = new IntersectionObserver((entries)=>{
        for (const e of entries){
          const v = e.target;
          if (e.isIntersecting){

            const sources = v.querySelectorAll('source[data-src]');
            sources.forEach(s=>{
              s.src = s.dataset.src;
              s.removeAttribute('data-src');
            });

            if (v.preload === 'none') v.preload = 'metadata';
            v.load();
            v.addEventListener('canplay', ()=>{
              if (v.dataset.autoplay === 'true' || v.autoplay){

                v.play().catch(()=>{ /* 忽略自动播放失败 */ });
              }
            }, { once:true });
          }else{

            if (!v.paused) v.pause();
          }
        }
      }, { rootMargin: '200px 0px' }); 
    

      document.querySelectorAll('video.lazy-video').forEach(v=>{

        v.preload = 'none';
        inView.observe(v);
      });
    

    })();
    </script>

  <script>
  /* ---- SEGUE supplementary curation overlay (LOCALHOST ONLY) ----
     The static HTML is byte-identical on every host; this script builds all controls at runtime
     and only when served from localhost / 127.0.0.1. It reads the curation plan from
     site_plan.json (a symlink to eval_ladder/viewer/collections/site_plan.json), un-hides the
     data-hidden markup (dims it with a striped overlay + unhide button so the owner can bring it
     back), and lets the owner reorder classes / blocks / rows and hide-unhide blocks / rows /
     cells. "Save plan" POSTs the plan rebuilt from the current DOM with optimistic concurrency
     (X-Base-Updated); on 409 it re-fetches, rebuilds on top, retries once; on failure it keeps a
     localStorage mirror and shows the error. DOM updates immediately; no rebuild needed to preview
     — the public build applies the same plan server-side. */
  (function(){
    var host = location.hostname;
    var LOCAL = (host === "localhost" || host === "127.0.0.1");
    /* 2026-09-25 (owner): the curation page is also published at /curate.html so a co-author can review;
       there the overlay runs READ-ONLY against the published plan copy — "Save" downloads the plan JSON
       to send back (no server to POST to on GitHub Pages). */
    var PUBLIC_CURATE = !LOCAL && /curate\.html$/.test(location.pathname);
    if (!LOCAL && !PUBLIC_CURATE) return;
    document.body.classList.add("seg-ov");   /* activates the .ovh dim / hide rules (was missing: nothing ever dimmed or hid) */
    var PLAN_URL = "site_plan.json";
    var LS_KEY   = "segue_siteplan_mirror";
    var GALLERY  = {C:1, D:1};
    var base     = {schema:1, updated:"", sections:{}};   /* last server plan (updated + merge_into) */
    var unsaved  = 0, saving = false, planLoaded = false;  /* Save stays disabled until the server plan loads, so a stale DOM can never overwrite it */

    function E(tag, cls, txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
    function bump(){ unsaved++; refreshBar(); }

    /* --- move a node past its same-kind siblings --- */
    function adj(node, dir, sel){
      var s = dir<0 ? node.previousElementSibling : node.nextElementSibling;
      while (s && !s.matches(sel)) s = dir<0 ? s.previousElementSibling : s.nextElementSibling;
      return s;
    }
    function moveWithin(node, dir, sel){
      var sib = adj(node, dir, sel); if(!sib) return;
      if (dir<0) node.parentNode.insertBefore(node, sib);
      else node.parentNode.insertBefore(sib, node);
      bump();
    }
    function setHidden(node, on){
      node.classList.toggle("ovh", on);
      node.removeAttribute("data-hidden");
      /* hide -> send the item to the END of its container (block for a cell, class group for a
         block/row) so it lands last in cell_order/block_order/row_order on save; unhide leaves it
         in place so the owner can then move it with the arrows. */
      if (on) node.parentNode.appendChild(node);
      /* class heading follows its content: a class whose blocks/rows are all hidden is hidden too
         (mirrors the builder's data-hidden on the group); unhiding anything inside brings it back */
      var grp = node.classList.contains("seg-classgroup") ? null : node.closest(".seg-classgroup");
      if (grp && !node.classList.contains("seg-cellwrap")) {
        var kids = grp.querySelectorAll(":scope > .seg-blockwrap, :scope > [data-item]");
        var anyVis = false; kids.forEach(function(k){ if (!k.classList.contains("ovh")) anyVis = true; });
        grp.classList.toggle("ovh", kids.length > 0 && !anyVis);
      }
      bump();
    }

    /* --- APPLY the fetched server plan to the DOM (authority once fetched; the render-time baked
       order + data-hidden markup must not fight it). Reorders + marks hidden, never bumps. --- */
    function reorder(nodes, idOf, order){
      if (!nodes.length) return;
      var parent = nodes[0].parentNode, byId = {}, seen = {}, seq = [];
      nodes.forEach(function(n){ byId[idOf(n)] = n; });
      (order || []).forEach(function(id){ if (byId[id] && !seen[id]){ seq.push(byId[id]); seen[id]=1; } });
      nodes.forEach(function(n){ var id=idOf(n); if(!seen[id]){ seq.push(n); seen[id]=1; } });
      seq.forEach(function(n){ parent.appendChild(n); });   /* re-append in order; other children (classhead) stay put */
    }
    function markOvh(node, on){ node.classList.toggle("ovh", on); node.removeAttribute("data-hidden"); }
    function idClass(n){ return n.dataset.class; }
    function idBlock(n){ return n.dataset.block; }
    function idItem(n){ return n.dataset.item; }
    function applyPlan(plan){
      var secs = (plan && plan.sections) || {};
      ["C","D","A","B"].forEach(function(S){
        var ps = secs[S] || {};
        var groups = [].slice.call(document.querySelectorAll('.seg-classgroup[data-section="'+S+'"]'));
        reorder(groups, idClass, ps.class_order);
        if (GALLERY[S]){
          var hb={}; (ps.hidden_blocks||[]).forEach(function(x){hb[x]=1;});
          var hc=ps.hidden_cells||{}, bo=ps.block_order||{}, co=ps.cell_order||{};
          groups.forEach(function(g){
            var cls=g.dataset.class;
            var blocks=[].slice.call(g.querySelectorAll('.seg-blockwrap'));
            reorder(blocks, idBlock, bo[cls]);
            blocks.forEach(function(b){
              var bid=b.dataset.block;
              markOvh(b, !!hb[bid]);
              var cells=[].slice.call(b.querySelectorAll('.seg-cellwrap'));
              reorder(cells, idItem, co[bid]);
              var hcs={}; (hc[bid]||[]).forEach(function(x){hcs[x]=1;});
              cells.forEach(function(c){ markOvh(c, !!hcs[c.dataset.item]); });
            });
          });
        } else {
          var hr={}; (ps.hidden_rows||[]).forEach(function(x){hr[x]=1;});
          var ro=ps.row_order||{};
          groups.forEach(function(g){
            var cls=g.dataset.class;
            var rows=[].slice.call(g.querySelectorAll('.seg-strip'));
            reorder(rows, idItem, ro[cls]);
            rows.forEach(function(r){ markOvh(r, !!hr[r.dataset.item]); });
          });
        }
      });
    }

    /* --- build the plan from the current DOM (+ merge_into carried from the server plan) --- */
    function buildPlan(){
      var sections = {};
      ["A","B","C","D"].forEach(function(S){
        var groups = document.querySelectorAll('.seg-classgroup[data-section="'+S+'"]');
        var class_order = [];
        if (GALLERY[S]){
          var block_order={}, cell_order={}, hidden_blocks=[], hidden_cells={};
          groups.forEach(function(g){
            var cls=g.dataset.class; class_order.push(cls); var lst=[];
            g.querySelectorAll('.seg-blockwrap').forEach(function(b){
              lst.push(b.dataset.block);
              if (b.classList.contains("ovh")) hidden_blocks.push(b.dataset.block);
              var hc=[], co=[];
              b.querySelectorAll('.seg-cellwrap').forEach(function(c){
                co.push(c.dataset.item);
                if (c.classList.contains("ovh")) hc.push(c.dataset.item);
              });
              if (hc.length) hidden_cells[b.dataset.block]=hc;
              cell_order[b.dataset.block]=co;
            });
            block_order[cls]=lst;
          });
          var mi = (base.sections && base.sections[S] && base.sections[S].merge_into) || {};
          sections[S] = {class_order:class_order, block_order:block_order, cell_order:cell_order,
                         hidden_blocks:hidden_blocks, hidden_cells:hidden_cells, merge_into:mi};
        } else {
          var row_order={}, hidden_rows=[];
          groups.forEach(function(g){
            var cls=g.dataset.class; class_order.push(cls); var lst=[];
            g.querySelectorAll('.seg-strip').forEach(function(r){
              lst.push(r.dataset.item);
              if (r.classList.contains("ovh")) hidden_rows.push(r.dataset.item);
            });
            row_order[cls]=lst;
          });
          sections[S] = {class_order:class_order, row_order:row_order, hidden_rows:hidden_rows};
        }
      });
      return {schema:1, updated:base.updated, sections:sections};
    }

    /* --- server load / save (optimistic concurrency; 409 -> refetch, rebuild, retry once) --- */
    function mirror(p){ try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){} }
    function post(plan, baseUpdated){
      return fetch(PLAN_URL, {method:"POST",
        headers:{"Content-Type":"application/json","X-Base-Updated":baseUpdated||""},
        body:JSON.stringify(plan)});
    }
    function downloadPlan(){
      var plan = buildPlan(); plan.schema = 1; plan.updated = new Date().toISOString(); plan.exported_by = "curate.html (public, read-only)";
      var blob = new Blob([JSON.stringify(plan, null, 1)], {type: "application/json"});
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = "site_plan." + plan.updated.replace(/[:.]/g, "-") + ".json";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      unsaved = 0; setStatus("plan downloaded " + hhmm() + " — send the file to the owner", ""); refreshBar();
    }
    function savePlan(){
      if (PUBLIC_CURATE){ downloadPlan(); return; }
      if (saving) return;
      if (!planLoaded){ setStatus("plan not loaded — Save disabled (refresh the page)","err"); return; }
      saving=true; setStatus("saving…","");
      var plan = buildPlan(); mirror(plan);
      post(plan, base.updated).then(function(r){
        if (r.status===409){ return r.json().then(function(j){
          /* server changed under us: sync the DOM to the server's latest, then re-apply my edits on
             top, then retry once — never overwrite blindly from a stale DOM. */
          var cur = (j && j.current) || {};
          if (typeof cur.updated==="string") base.updated=cur.updated;
          base.sections = cur.sections || base.sections;
          applyPlan(cur);
          applyPlan(plan);
          var again = buildPlan(); mirror(again);
          return post(again, base.updated);
        }); }
        return r;
      }).then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
      }).then(function(j){
        base.updated = j.updated || base.updated; unsaved=0; saving=false; setStatus("saved "+hhmm(),"");
        refreshBar();
      }).catch(function(e){
        saving=false; mirror(buildPlan()); setStatus("save FAILED — kept a local copy ("+e+")","err"); refreshBar();
      });
    }
    function hhmm(){ var d=new Date(),p=function(n){return(n<10?"0":"")+n;}; return p(d.getHours())+":"+p(d.getMinutes()); }

    /* --- sticky bottom bar --- */
    var LS_SHOW = "segue_siteplan_showhidden";           /* "1" show dimmed, "0" hide (default: owner 2026-09-25 "it does not hide things when i click hide?") */
    var bar, barMsg, barHidden, barToggle, barStatus, barSave;
    function showHidden(){ try{ return localStorage.getItem(LS_SHOW)==="1"; }catch(e){ return false; } }
    function applyShowHidden(){
      var show = showHidden();
      document.body.classList.toggle("seg-ov-hide", !show);
      if (barToggle) barToggle.textContent = show ? "Hide hidden" : "Show hidden";
    }
    function makeBar(){
      bar = E("div","seg-ov-bar");
      barMsg = E("span","seg-ov-msg", PUBLIC_CURATE ? "curation review (read-only copy: reorder/hide here, then Download plan and send it back)" : "curation overlay");
      barHidden = E("span","seg-ov-hidden","");
      barToggle = E("button","seg-ov-toggle","");
      barToggle.addEventListener("click", function(){
        try{ localStorage.setItem(LS_SHOW, showHidden() ? "0" : "1"); }catch(e){}
        applyShowHidden();
      });
      barStatus = E("span","seg-ov-status","");
      barSave = E("button","seg-ov-save", PUBLIC_CURATE ? "Download plan" : "Save plan");
      barSave.addEventListener("click", savePlan);
      bar.appendChild(barMsg); bar.appendChild(barHidden); bar.appendChild(barToggle);
      bar.appendChild(barStatus); bar.appendChild(barSave);
      document.body.appendChild(bar);
      applyShowHidden();
      refreshBar();
    }
    function setStatus(t, cls){ if(barStatus) barStatus.textContent=t; if(bar) bar.classList.toggle("err", cls==="err"); }
    function refreshBar(){
      if(!bar) return;
      bar.classList.add("show");
      barMsg.textContent = unsaved+" unsaved change"+(unsaved===1?"":"s");
      var nh = document.querySelectorAll(".ovh").length;
      barHidden.textContent = nh+" hidden";
      barSave.disabled = (!planLoaded) || (unsaved===0) || saving;
    }

    /* --- inject controls --- */
    function arrowGroup(node, sel){
      var g=E("span","seg-ov-ctl");
      var up=E("button",null,"▲"), dn=E("button",null,"▼");
      up.title="move up"; dn.title="move down";
      up.addEventListener("click",function(){moveWithin(node,-1,sel);});
      dn.addEventListener("click",function(){moveWithin(node,1,sel);});
      g.appendChild(up); g.appendChild(dn); return g;
    }
    function hideBtn(node){
      var g=E("span","seg-ov-ctl");
      var b=E("button","seg-ov-hidebtn", node.classList.contains("ovh")?"unhide":"hide");
      if(node.classList.contains("ovh")) b.classList.add("on");
      b.addEventListener("click",function(){
        var nowHidden=!node.classList.contains("ovh");
        setHidden(node, nowHidden);
        b.textContent=nowHidden?"unhide":"hide"; b.classList.toggle("on",nowHidden);
      });
      g.appendChild(b); return g;
    }

    function build(){
      /* un-hide the data-hidden markup, mark dimmed */
      document.querySelectorAll('[data-hidden="1"]').forEach(function(n){ n.classList.add("ovh"); n.removeAttribute("data-hidden"); });
      /* class heads: reorder the whole classgroup */
      document.querySelectorAll('.seg-classhead').forEach(function(h){
        h.insertBefore(arrowGroup(h.closest('.seg-classgroup'), '.seg-classgroup'), h.firstChild);
      });
      /* gallery blocks (C/D): reorder within class + hide/unhide */
      document.querySelectorAll('.seg-blockwrap').forEach(function(b){
        var ctl=E("span","seg-ov-ctl-wrap");
        ctl.appendChild(arrowGroup(b,'.seg-blockwrap')); ctl.appendChild(hideBtn(b));
        b.insertBefore(ctl, b.firstChild);
        b.querySelectorAll('.seg-cellwrap').forEach(function(c){
          var cc=E("span","seg-ov-cellctl");
          var lf=E("button",null,"◀"), rt=E("button",null,"▶");
          lf.title="move earlier"; rt.title="move later";
          lf.addEventListener("click",function(){moveWithin(c,-1,'.seg-cellwrap');});
          rt.addEventListener("click",function(){moveWithin(c,1,'.seg-cellwrap');});
          var hb=E("button", c.classList.contains("ovh")?"on":null, c.classList.contains("ovh")?"unhide":"hide");
          hb.addEventListener("click",function(){
            var nh=!c.classList.contains("ovh"); setHidden(c,nh);
            hb.textContent=nh?"unhide":"hide"; hb.classList.toggle("on",nh);
          });
          cc.appendChild(lf); cc.appendChild(rt); cc.appendChild(hb); c.appendChild(cc);
        });
      });
      /* comparison rows (A/B): reorder within class + hide/unhide + judge badge */
      document.querySelectorAll('.seg-strip').forEach(function(r){
        var ctl=E("span","seg-ov-ctl-wrap");
        ctl.appendChild(arrowGroup(r,'.seg-strip')); ctl.appendChild(hideBtn(r));
        if (r.dataset.judge){
          try{ var jv=JSON.parse(r.dataset.judge); var parts=[];
            Object.keys(jv).forEach(function(k){ parts.push(k+(jv[k]>=1?" ✓":" "+jv[k])); });
            ctl.appendChild(E("span","seg-ov-judge","judge win vs "+parts.join(", ")));
          }catch(e){}
        }
        r.insertBefore(ctl, r.firstChild);
      });
      makeBar();
    }

    fetch(PLAN_URL+"?t="+Date.now(), {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
    }).then(function(j){
      if (j && typeof j==="object" && j.sections){
        base.updated=j.updated||""; base.sections=j.sections; planLoaded=true;
        applyPlan(j);                       /* AUTHORITY: sync the DOM to the saved plan before controls */
      } else { throw new Error("bad plan"); }
    }).catch(function(e){ planLoaded=false; })
      .then(function(){
        build();
        unsaved=0;
        if (!planLoaded) setStatus("plan load FAILED — Save disabled; refresh the page","err");
        refreshBar();
      });
  })();
  </script>
<!--OVERLAY-JS-END-->

 </body>
</html>
